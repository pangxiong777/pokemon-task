/* ---------- 宝可梦叫声 ---------- */
/* 每种宝可梦的叫声放在 assets/cries/<图鉴编号>.mp3。
   若文件缺失（例如新增了图鉴外的宝可梦），用按编号+属性合成的短促滑音兜底，
   保证「每只听起来都不一样」。 */
var cryEl=null;
function cryNo(sid){ return ('000'+((POKE_IMG&&POKE_IMG[sid])||1)).slice(-3); }
function playCry(sid){
  if(!SOUND) return;
  var n=cryNo(sid);
  try{
    if(cryEl){ try{ cryEl.pause(); cryEl.currentTime=0; }catch(e){} }
    var el=(typeof ASSET_CRY!=='undefined'&&ASSET_CRY[n])?new Audio(ASSET_CRY[n]):new Audio('assets/cries/'+n+'.mp3');
    el.volume=0.72;
    cryEl=el;
    el.onerror=function(){ cryFallback(sid); };
    var p=el.play();
    if(p&&p.catch){ p.catch(function(){ cryFallback(sid); }); }
  }catch(e){ cryFallback(sid); }
}
/* 兜底合成：同一只每次音色一致，不同只之间音高/波形不同 */
function cryFallback(sid){
  var s=String(sid),h=3;
  for(var i=0;i<s.length;i++){ h=(h*33+s.charCodeAt(i)*7+11)%997; }
  var sp=(typeof spec==='function')?spec(sid):null;
  var typeMap={'电':0,'火':1,'水':2,'草':3,'虫':4,'飞行':5,'一般':6,'超能力':7,'龙':8,'地面':9};
  var tIdx=typeMap[(sp&&sp.type)||'一般']||0;
  var base=280+h%260;                      /* 280~540Hz */
  var wave=['square','sawtooth','triangle','sine'][tIdx%4];
  var d1=0.07+((h>>3)%5)*0.012;
  beep(base,d1,wave,0.10);
  setTimeout(function(){ beep(base*(1.28+((h>>5)%3)*0.12),d1*1.5,wave,0.085); },70);
  setTimeout(function(){ beep(base*0.82,d1*1.1,'triangle',0.06); },175);
}

function pokeDexNo(sid){ return ('000'+((POKE_IMG&&POKE_IMG[sid])||1)).slice(-3); }
/* 本地优先；失败再退官方 CDN（与本地同款图鉴立绘） */
function pokeImgCdn(n){ return 'https://assets.pokemon.com/assets/cms2/img/pokedex/detail/'+n+'.png'; }
function pokeImg(sid){
  var n=pokeDexNo(sid);
  if(typeof ASSET_IMG!=='undefined'&&ASSET_IMG[n]) return ASSET_IMG[n];
  return 'assets/pokedex/'+n+'.png';
}
function pokeImgAttrs(sid,extra){
  var n=pokeDexNo(sid), src=pokeImg(sid);
  var alt='';
  try{ alt=esc((spec(sid)&&spec(sid).name)||''); }catch(e){}
  var more=(extra||'');
  if(!/\bdecoding\s*=/.test(more)) more+=' decoding="async"';
  if(src.indexOf('data:')!==0){
    more+=' data-poke="'+n+'" data-fb="0" onerror="pokeImgFallback(this)"';
  }
  return 'src="'+src+'" alt="'+alt+'" '+more;
}
function pokeImgHTML(sid,extra){
  return '<img '+pokeImgAttrs(sid,extra)+'>';
}
function pokeImgFallback(el){
  try{
    if(!el) return;
    var n=el.getAttribute('data-poke')||'001';
    var step=parseInt(el.getAttribute('data-fb')||'0',10)||0;
    if(step<=0){
      el.setAttribute('data-fb','1');
      el.referrerPolicy='no-referrer';
      el.src=pokeImgCdn(n);
      return;
    }
    el.onerror=null;
  }catch(e){ try{ el.onerror=null; }catch(e2){} }
}

}

var NEW_SUBJECTS=['画画','拍皮球','幼儿园表现','骑自行车','好好吃饭','阅读绘本','收拾玩具'];
function defaultState(){

/* S 在 kidsInit() 之后才真正加载（见下方 S=load()）：
   必须优先读「当前孩子的独立存档」，读不到才回退旧版单一键 KEY，
   否则每次重启都会拿旧快照，下一次 save() 就把新进度覆盖没了（回退bug）。 */
var S=null;
function load(){
  var s=defaultState();
  try{
    var k=(KIDS&&KIDS.list&&KIDS.list.length)?activeKid():null;
    var raw=k?localStorage.getItem(kidStorageKey(k.key)):null;
    if(!raw) raw=localStorage.getItem(KEY)||localStorage.getItem('pkHomeworkApp.v1.legacy');
    if(raw){
      var d=JSON.parse(raw);
      if(d&&typeof d==='object'){
        var m=s, k2;
        for(k2 in d){ if(k2 in m){ m[k2]=d[k2]; } }
        /* 旧存档科目迁移：若科目还是旧的默认列表（说明家长没自定义过），换为幼儿园任务版 */
        if(Array.isArray(m.subjects)&&m.subjects.length===OLD_SUBJECTS.length&&OLD_SUBJECTS.every(function(x,i){return m.subjects[i]===x;})){
          m.subjects=NEW_SUBJECTS.slice();
        }
      }
    }
  }catch(e){}
  if(!Array.isArray(s.box)) s.box=[];
  if(!s.dex||typeof s.dex!=='object'||Array.isArray(s.dex)) s.dex={};
  if(typeof s.dailyTarget!=='number'||!(s.dailyTarget>=1)) s.dailyTarget=7;
  if(typeof s.dailyReward!=='number'||!(s.dailyReward>=1)) s.dailyReward=1;
  if(typeof s.weekendFree!=='number'||!(s.weekendFree>=0)) s.weekendFree=3;
  if(typeof s.fastMult!=='number'||!(s.fastMult>=1)) s.fastMult=1.2;
  s.baseXP=coerceNum(s.baseXP,20,5,100);
  s.streakTarget=coerceNum(s.streakTarget,7,3,14);
  s.fastMult=Math.round(coerceNum(s.fastMult,1.2,1,3)*10)/10;
  if(!s.deadline) s.deadline='21:30';
  /* 兼容：把老存档里未知物种（若数据更新前残留）也标记到图鉴 */
  return s;
}
function coerceNum(v,fallback,min,max){
  var n=(typeof v==='number')?v:parseFloat(v);
  if(isNaN(n)) return fallback;
  if(min!=null&&n<min) return fallback;
  if(max!=null&&n>max) return fallback;
  return n;
}
/* save() 永远写入“当前孩子”的独立空间；KEY 只作为老存档的迁移来源 */
function save(){
  try{
    var k=activeKid();
    localStorage.setItem(k?kidStorageKey(k.key):KEY,JSON.stringify(S));
  }catch(e){}
}

/* ---------- 多娃存档管理 ----------
   KIDS = { active:'<key>', list:[{key,av,name}] }，每人的进度存在 KEY+'.'+key 里 */
var KIDS=null;
function kidStorageKey(k){ return 'pkHomeworkApp.v1.'+k; }
function newKidEntry(name,av){
  var k='k'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  return {key:k,av:av||'🧒',name:name||('宝贝'+(Date.now()%90+10))};
}
function migrateLegacySave(){
  /* 老版本只有一条存档（存在旧的 KEY 或 legacy 位置），迁移成一个孩子 */
  var had=false;
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) raw=localStorage.getItem('pkHomeworkApp.v1.legacy');
    if(raw){
      var d=JSON.parse(raw); had=true;
      var nm=(d&&d.childName)?d.childName:'吨吨';
      var kid=newKidEntry(nm,'🧒');
      try{ localStorage.setItem(kidStorageKey(kid.key),raw); }catch(e){}
      KIDS={active:kid.key,list:[kid]};
      localStorage.setItem(KIDS_KEY,JSON.stringify(KIDS));
      return KIDS;
    }
  }catch(e){}
  var kid=newKidEntry('吨吨','🧒');
  KIDS={active:kid.key,list:[kid]};
  try{ localStorage.setItem(KIDS_KEY,JSON.stringify(KIDS)); }catch(e){}
  return KIDS;
}
function kidsInit(){
  try{
    var raw=localStorage.getItem(KIDS_KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(d&&Array.isArray(d.list)&&d.list.length){
        d.list=d.list.slice(0,KIDS_MAX);
        var ok=false;
        d.list.forEach(function(k){ if(k.key===d.active) ok=true; });
        if(!ok) d.active=d.list[0].key;
        KIDS=d;
        return;
      }
    }
  }catch(e){}
  KIDS=migrateLegacySave();
}
kidsInit();
S=load();                                 /* 多娃系统就绪后再加载当前孩子的进度 */
function activeKid(){
  if(!KIDS||!KIDS.list.length) kidsInit();
  var k=KIDS.list.filter(function(x){return x.key===KIDS.active;})[0];
  return k||KIDS.list[0];
}
function kidAt(i){ return KIDS.list[i]; }
function saveKids(){ try{ localStorage.setItem(KIDS_KEY,JSON.stringify(KIDS)); }catch(e){} }
function loadKidState(key){
  var s=defaultState();
  try{
    var raw=localStorage.getItem(kidStorageKey(key));
    if(raw){
      var d=JSON.parse(raw);
      if(d&&typeof d==='object'){ for(var k in d){ if(k in s){ s[k]=d[k]; } } }
    }
  }catch(e){}
  if(!Array.isArray(s.box)) s.box=[];
  if(!s.dex||typeof s.dex!=='object'||Array.isArray(s.dex)) s.dex={};
  return s;
}
/* 与 load() 等价的迁移逻辑，用于切换孩子时把数据清洗一遍 */
function normalizeState(s){
  try{
    if(Array.isArray(s.subjects)&&s.subjects.length===OLD_SUBJECTS.length&&OLD_SUBJECTS.every(function(x,i){return s.subjects[i]===x;})){
      s.subjects=NEW_SUBJECTS.slice();
    }
  }catch(e){}
  if(!Array.isArray(s.box)) s.box=[];
  if(!s.dex||typeof s.dex!=='object'||Array.isArray(s.dex)) s.dex={};
  if(!Array.isArray(s.team)) s.team=[];
  if(!Array.isArray(s.homework)) s.homework=[];
  if(!Array.isArray(s.badges)) s.badges=[];
  if(!s.care||typeof s.care!=='object') s.care=defaultState().care;
  if(typeof s.dailyTarget!=='number'||!(s.dailyTarget>=1)) s.dailyTarget=7;
  if(typeof s.dailyReward!=='number'||!(s.dailyReward>=1)) s.dailyReward=1;
  if(typeof s.weekendFree!=='number'||!(s.weekendFree>=0)) s.weekendFree=3;
  if(typeof s.fastMult!=='number'||!(s.fastMult>=1)) s.fastMult=1.2;
  s.baseXP=coerceNum(s.baseXP,20,5,100);
  s.streakTarget=coerceNum(s.streakTarget,7,3,14);
  s.fastMult=Math.round(coerceNum(s.fastMult,1.2,1,3)*10)/10;
  if(!s.deadline) s.deadline='21:30';
  return s;
}
function dailyTarget(){ return Math.max(1,Math.min(20,S.dailyTarget|0||7)); }
function dailyReward(){ return Math.max(1,Math.min(5,S.dailyReward|0||1)); }
function weekendFreeMax(){ return Math.max(0,Math.min(7,S.weekendFree!=null?S.weekendFree|0:3)); }
function switchKid(key){
  if(!KIDS||key===KIDS.active) return;
  var target=KIDS.list.filter(function(x){return x.key===key;})[0];
  if(!target) return;
  save();
  KIDS.active=key; saveKids();
  S=normalizeState(loadKidState(key));
  careSel=0; arenaA=0; arenaB=1; window.__trPickShown=false;
  viewMode='child';
  save();
  closeModal();
  save();                                   /* 切换后立刻把新孩子的进度写回自己的存档 */
  location.hash='team';
  render();
  sfxOk();
  toast('已切换到 '+target.name+' 的进度');
}

function pickKidAv(el){

function createKid(){
  if(KIDS.list.length>=KIDS_MAX){ sfxBad(); toast('最多只能有 3 个孩子哦'); return; }
  var el=$('kidNameIn'); var nm=el?el.value.trim():'';
  if(!nm){ sfxBad(); toast('先给孩子起个名字吧'); return; }
  var avEl=document.querySelector('.av-pick.on');
  var av=avEl?avEl.getAttribute('data-av'):'🧒';
  save();
  var kid=newKidEntry(nm,av);
  KIDS.list.push(kid); KIDS.active=kid.key; saveKids();
  S=defaultState(); S.childName=nm; S.av=av;
  careSel=0; arenaA=0; arenaB=1; window.__trPickShown=false;

  closeModal();
  location.hash='team'; render();

function doRemoveKid(key){
  var wasActive=(key===KIDS.active);

function movesOf(mon){ var sp=spec(mon.sid); return (sp.moves||[]).filter(function(mv){return mv.at<=mon.level;}); }
function nextEvo(mon){ var sp=spec(mon.sid); for(var i=0;i<sp.evo.length;i++){ if(sp.evo[i].at>mon.level) return sp.evo[i]; } return null; }
function canEvo(mon){ var sp=spec(mon.sid); return sp.evo.length>0 && mon.level>=sp.evo[0].at; }
function evoAt(mon){ var sp=spec(mon.sid); return sp.evo.length?sp.evo[0].at:null; }
function avgLevel(){ if(!S.team.length)return 0; var t=0; S.team.forEach(function(m){t+=m.level;}); return Math.round(t/S.team.length); }
function newMon(sid,level,source){
  return {id:uid(),sid:sid,nick:spec(sid).name,level:level||5,xp:0,source:source||'starter'};
}
function addXP(mon,xp){
  var ev=[]; mon.xp+=xp;
  while(mon.xp>=xpNeed(mon.level)){
    mon.xp-=xpNeed(mon.level); mon.level++;
    var sp=spec(mon.sid);
    var mv=null, eo=null;
    sp.moves.forEach(function(m){ if(m.at===mon.level) mv=m.m; });
    if(canEvo(mon)){
      eo=sp.evo[0].to;
      mon.sid=eo; mon.nick=spec(eo).name;
      markDex(eo);
      var sp2=spec(mon.sid);
      sp2.moves.forEach(function(m){ if(m.at===1) mv=m.m; });
    }
    ev.push({type:eo?'evo':(mv?'levelmove':'level'),oldSid:mon.sid,mon:mon,newLevel:mon.level,move:mv,evoTo:eo});
  }
  return ev;
}
function addTeamXP(xp){
  var all=[];
  S.team.forEach(function(m){ all=all.concat(addXP(m,xp)); });
  S.totalXP+=xp;

}
function fastBonus(){ var t=nowHM(); return t<=S.deadline; }
function calcXP(){
  var base=S.baseXP*(fastBonus()?S.fastMult:1);
  base=base*S.nextBonusMult;
  S.nextBonusMult=1;
  return Math.round(base);
}
function todayApproved(){

function streakPush(){

  else{ st.count=1; }
  st.lastDate=t;
  if(st.count>st.record) st.record=st.count;
  var prize=false;
  if(st.count>0 && st.count%S.streakTarget===0 && st.count>st.lastPrize){
    st.lastPrize=st.count; prize=true;
  }
  save();
  return prize;
}

function replaceMon(idx,sid,source,level){

function findBoxedSid(sid){

/* 捕捉 */
function encounter(rare){
  var sid;
  if(rare){ sid=RARE_PICK[rnd(RARE_PICK.length)]; }
  else{
    var r=Math.random();
    if(r<0.72){ sid=pickWeighted(COMMON_POOL); }
    else if(r<0.95){ sid=pickWeighted(UNCOMMON_POOL); }
    else{ sid=pickWeighted(RARE_POOL); }
  }
  var sp=spec(sid);
  var zone,catchRate;
  if(LEGEND_POOL.some(function(x){return x.v===sid;})){zone=14;catchRate=0.25;}
  else if(sp.type==='龙'||['dratini','dragonair'].indexOf(sid)>-1){zone=14;catchRate=0.35;}
  else if(UNCOMMON_POOL.some(function(x){return x.v===sid;})||RARE_POOL.some(function(x){return x.v===sid;})){zone=22;catchRate=0.55;}
  else{zone=32;catchRate=0.8;}
  if(rare){zone=22;catchRate=0.55;}
  return {sid:sid,zone:zone,catchRate:catchRate};
}
function freeLeft(){ return Math.max(0,weekendFreeMax()-S.captures.used); }
function captureAllowed(){
  if(S.captures.week!==weekKey()){
    S.captures.week=weekKey(); S.captures.used=0; save();
  }
  return {free:freeLeft(),vouchers:S.items.vouchers,rare:S.items.rareVouchers};
}
function spendCapture(useRare){
  var c=captureAllowed();
  if(useRare){ if(S.items.rareVouchers<=0)return false; S.items.rareVouchers--; }
  else if(c.free>0){ S.captures.used++; }
  else if(S.items.vouchers>0){ S.items.vouchers--; }
  else{ return false; }
  save(); return true;
}

function addBadge(gid){

function sealDaysLeft(){
  var sn=S.snorlax;
  if(sn.state!=='sealed') return 0;
  var left=7-Math.floor((Date.now()-sn.sealedAt)/86400000);
  return Math.max(0,left);
}
function findSnorlax(){
  var i;
  for(i=0;i<S.team.length;i++){ if(S.team[i].sid==='snorlax') return {where:'team',i:i,m:S.team[i]}; }
  for(i=0;i<(S.box||[]).length;i++){ if(S.box[i].sid==='snorlax') return {where:'box',i:i,m:S.box[i]}; }
  return null;
}
/* 道馆封印球只会送一只：若误操作生成了多只 gym 卡比兽，只保留等级/经验最高的那只 */
function cleanupGymSnorlaxDupes(){
  var list=[], i;
  for(i=0;i<S.team.length;i++){
    if(S.team[i].sid==='snorlax'&&S.team[i].source==='gym') list.push({where:'team',i:i,m:S.team[i]});
  }
  for(i=0;i<(S.box||[]).length;i++){
    if(S.box[i].sid==='snorlax'&&S.box[i].source==='gym') list.push({where:'box',i:i,m:S.box[i]});
  }
  if(list.length<=1) return false;
  list.sort(function(a,b){ return (b.m.level-a.m.level)||(b.m.xp-a.m.xp); });
  var drop=list.slice(1).sort(function(a,b){
    if(a.where!==b.where) return a.where==='team'?-1:1;
    return b.i-a.i;
  });
  for(i=0;i<drop.length;i++){
    if(drop[i].where==='team') S.team.splice(drop[i].i,1);
    else S.box.splice(drop[i].i,1);
  }
  save();
  return true;
}
function checkSeal(){
  var sn=S.snorlax;
  if(sn.state==='sealed' && sealDaysLeft()<=0){
    sn.state='active';
    /* 已经有卡比兽（队伍或盒子）就不要再造一只 */
    if(findSnorlax()){ save(); return 'joined'; }
    var r=tryAddMon('snorlax','gym',5);
    save();
    if(r.boxed) return 'boxed';
    return 'joined';
  }
  return null;
}

    for(var k=0;k<4;k++){ html+='<span class="crumbs" style="left:'+(40+k*7)+'%;animation-delay:'+(0.85+k*0.45).toFixed(2)+'s">✧</span>'; }

    if(isFav){ html+='<span class="favbit">⭐ 最爱口味！</span>'; }
  }else{
    /* 泡泡、蒸汽、溅水，按沐浴种类加强特效 */
    html+='<div class="care-steam"><i style="left:18%;animation-delay:0s">☁️</i><i style="left:48%;animation-delay:.4s">💨</i><i style="left:72%;animation-delay:.8s">☁️</i></div>';

    if(bi===1){ for(var p=0;p<14;p++){ html+='<span class="petalbit" style="left:'+(4+Math.random()*86)+'%;font-size:'+(14+Math.random()*10).toFixed(0)+'px;animation-delay:'+(Math.random()*2).toFixed(2)+'s">🌸</span>'; } }
    if(bi===2){ for(var f=0;f<10;f++){ html+='<span class="foambit" style="left:'+(6+Math.random()*82)+'%;bottom:'+(12+Math.random()*54)+'px;animation-delay:'+(Math.random()*1.5).toFixed(2)+'s"></span>'; } }
    if(bi===3){ for(var dk=0;dk<3;dk++){ html+='<span class="duckbit" style="left:'+(12+dk*28+Math.random()*8)+'%;animation-delay:'+(dk*0.3).toFixed(2)+'s">🦆</span>'; } }
    else{ html+='<span class="duckbit" style="left:'+(18+Math.random()*46)+'%">🦆</span>'; }
    for(var j2=0;j2<8;j2++){ html+='<span class="sparklebit" style="left:'+(10+Math.random()*78)+'%;top:'+(18+Math.random()*52)+'%;animation-delay:'+(Math.random()*1.2).toFixed(2)+'s">✨</span>'; }
    html+='<div class="water-rip"></div><div class="water-rip" style="animation-delay:.8s;bottom:18px;width:120px"></div>';
  }
  fx.innerHTML=html;
  /* 分阶段动作 + 专属音效（不再只用通用点击音） */
  if(isFeed){
    sfxFeedStart(fi);
    setMonPose('eat'); setPhase('phase-eat');
    for(var mi=0;mi<5;mi++){ (function(ii){ setTimeout(function(){ sfxFeedMunch(ii+fi); }, 420+ii*320); })(mi); }
    setTimeout(function(){ setMonPose('happy'); setPhase('phase-happy'); sfxFeedHappy(isFav); }, 2100);
  }else{
    sfxBathStart(bi);
    var splash=$('careSplash'); if(splash){ setTimeout(function(){ splash.classList.add('go'); },180); }
    setMonPose('scrub'); setPhase('phase-scrub');

    setTimeout(function(){ setMonPose('rinse'); setPhase('phase-rinse'); sfxBathRinse(); }, 2000);
    setTimeout(function(){ setMonPose('sparkle'); setPhase('phase-happy'); sfxBathDone(); }, 3000);
  }
  var lines=isFeed
    ? [mon.nick+' 闻到 '+food.nm+' 的香味跑过来啦！','啊呜啊呜，'+food.nm+'真好吃！',(isFav?'这是它最爱的一口，开心得原地转圈！':'摸摸圆滚滚的肚子，好满足～')]

  var li=0;
  (function step(){
    var cap=$('careCap');
    if(cap&&li<lines.length){ cap.textContent=lines[li]; li++; setTimeout(step,1450); return; }
    var doneHTML='';
    if(!replay){
      var target=S.team.filter(function(x){return x.id===mon.id;})[0];
      var ev=target?addXP(target,gain):[];
      if(isFeed){ S.care.feedDate=todayStr(); S.care.feedMon=mon.id; S.care.feedKind=fi; }
      else{ S.care.bathDate=todayStr(); S.care.bathMon=mon.id; S.care.bathKind=bi; }
      save();
      var lv=ev.map(function(e){
        if(e.type==='evo') return '<p class="lead" style="color:#8e24aa;font-weight:900;margin:2px 0">'+esc(e.mon.nick)+' 进化了！！</p>';
        if(e.type==='levelmove') return '<p class="lead" style="color:#a06800;font-weight:900;margin:2px 0">'+esc(e.mon.nick)+' 升到 Lv.'+e.newLevel+'，学会「'+esc(e.move)+'」！</p>';
        if(e.type==='level') return '<p class="lead" style="color:#1e88e5;font-weight:900;margin:2px 0">'+esc(e.mon.nick)+' 升到 Lv.'+e.newLevel+'！</p>';
        return '';
      }).join('');
      doneHTML='<p class="lead" style="color:#43a047;font-weight:900;margin:6px 0 2px">'+esc(mon.nick)+' +'+gain+' 经验！'+(isFav?'（最爱的口味，多 +2）':'')+'</p>'+lv;
      if(ev.some(function(e){return e.type==='evo';})){ sfxEvo(); confetti(); }
      else if(ev.length){ sfxLevel(); confetti(); }
      else{ if(isFeed) sfxFeedHappy(isFav); else sfxBathDone(); confetti(); }
    }else{ if(isFeed) sfxFeedHappy(isFav); else sfxBathDone(); }
    var don=$('careDone'); if(don) don.innerHTML=doneHTML;
    var acts=$('careActs');
    if(acts) acts.innerHTML='<button class="btn btn-yellow btn-block" onclick="openCare(\''+action+'\',true,'+kind+')">🔁 再看一遍动画</button>'+
      '<button class="btn btn-primary btn-block" onclick="closeModal();render()">好啦！</button>';
    render();
  })();
}

      var r=calcDmg(atk.mon,dfn.mon,mv);
      dfn.hp=Math.max(0,dfn.hp-r.dmg);
      var heal=0;
      if(r.info.heal&&atk.hp>0){ heal=Math.min(r.info.heal,atk.max-atk.hp); atk.hp+=heal; }

      if(t.heal>0){ floatNum(atkSide,'+'+t.heal,'heal'); try{ sfxBattleHeal(); }catch(e3){} }
      hpUpdate(dfnSide,(dfnSide==='A'?t.hpA:t.hpB),(dfnSide==='A'?t.maxA:t.maxB));
      hpUpdate(atkSide,(atkSide==='A'?t.hpA:t.hpB),(atkSide==='A'?t.maxA:t.maxB));
      var extra=battleSideText(t.eff);
      var tail=extra?(' '+extra):'';
      if(t.ko){ tail=' '+dfnMon.nick+' 倒下了！'; if(dfnEl){ dfnEl.classList.add('faint'); } try{ sfxBattleFaint(); }catch(e4){} }
      setMsg(atkMon.nick+' 使用「'+t.move+'」！'+tail);
      i++;
      setTimeout(step, t.ko?900:820);
    },330);
  }
  function lvHTML(list){
    return list.map(function(e){
      if(e.type==='evo') return '<p class="lead" style="color:#8e24aa;font-weight:900;margin:2px 0">'+esc(e.mon.nick)+' 进化了！！</p>';
      if(e.type==='levelmove') return '<p class="lead" style="color:#a06800;font-weight:900;margin:2px 0">'+esc(e.mon.nick)+' 升到 Lv.'+e.newLevel+'，学会「'+esc(e.move)+'」！</p>';
      if(e.type==='level') return '<p class="lead" style="color:#1e88e5;font-weight:900;margin:2px 0">'+esc(e.mon.nick)+' 升到 Lv.'+e.newLevel+'！</p>';
      return '';
    }).join('');
  }
  function finish(){
    if(ended) return; ended=true;
    var winMon=(sim.winner==='A'?A:B), loseMon=(sim.winner==='A'?B:A);

    /* 钓鱼比试：自己的伙伴拿经验；水系野生宝可梦可再用精灵球捕捉 */
    if(cfg.mode==='fish'){
      var won=sim.winner==='A';
      var gain=won?(cfg.winXP||14):(cfg.loseXP||6);
      var evs=addXP(A,gain);
      save();
      if(won){ try{ sfxBattleWin(); }catch(e){} confetti(); } else { try{ sfxBattleFaint(); }catch(e){} sfxOk(); }
      window.__fishFoe=B;
      var balls=S.items.vouchers||0, rares=S.items.rareVouchers||0;
      var fe=$('arenaEnd');
      if(fe) fe.innerHTML=(won?'<div class="big-emoji">🏆</div><h3>比试赢了！</h3>'
                              :'<div class="big-emoji">💦</div><h3>差一点点…</h3>')+
        '<p class="lead">'+(won?esc(B.nick)+' 被 '+esc(A.nick)+' 的实力打动，在水边喘着气。'
                                :esc(B.nick)+' 在水里太灵活了，不过它还没游走！')+'</p>'+
        '<p class="lead" style="margin:6px 0 2px"><b style="color:#43a047">'+esc(A.nick)+' +'+gain+' 经验</b></p>'+
        lvHTML(evs)+
        '<p class="lead" style="font-size:12.5px;color:#0d5f7a;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap">想留下它的话，可以丢出 '+ballIco('poke',16)+' 精灵球捕捉！</p>'+
        '<div class="dlg-actions">'+
        (balls>0?'<button class="btn btn-green btn-block" onclick="fishCatch(false)">'+ballLabel('poke','精灵球捕捉（'+balls+'）')+'</button>':'')+
        (rares>0?'<button class="btn btn-yellow btn-block" onclick="fishCatch(true)">'+ballLabel('master','大师球捕捉（'+rares+'）')+'</button>':'')+
        (balls<=0&&rares<=0?'<p class="lead" style="font-size:12.5px;color:#8a7a6a">背包里没有球了，先去做任务赚几个吧</p>':'')+
        (fishLeft()>0?'<button class="btn btn-primary btn-block" onclick="closeModal();startFish()">🎣 再钓一次（今天还剩 '+fishLeft()+' 次）</button>':'')+
        '<button class="btn btn-gray btn-block" onclick="closeModal();render()">🐟 收杆回家</button></div>';
      render();
      return;
    }

    var evHTML='';
    if(rewardOK){
      var ev1=addXP(winMon,12), ev2=addXP(loseMon,5);
      S.arena.xpGiven=true; save();
      var lv=lvHTML(ev1.concat(ev2));
      evHTML='<p class="lead" style="margin:6px 0 2px"><b style="color:#43a047">'+esc(winMon.nick)+' +12 经验</b> · <b style="color:#1e88e5">'+esc(loseMon.nick)+' +5 经验</b></p>'+lv;
    }else{
      evHTML='<p class="lead" style="margin:6px 0 2px">友谊赛结束，今天的第一场才有经验奖励哦～</p>';
    }
    try{ sfxBattleWin(); }catch(e){} confetti();
    var e=$('arenaEnd');
    if(e) e.innerHTML='<div class="big-emoji">🏆</div><h3>'+esc(winMon.nick)+' 获胜！</h3>'+
      '<p class="lead">'+esc(loseMon.nick)+' 也很努力，下次一定赢回来！</p>'+evHTML+
      '<div class="dlg-actions">'+
      (S.arena.count<3?'<button class="btn btn-yellow btn-block" onclick="sfxBattleArm();closeModal();startArena()">⚔️ 再来一场（今天还剩 '+(3-S.arena.count)+' 场）</button>':'')+
      '<button class="btn btn-primary btn-block" onclick="closeModal();render()">结束对战</button></div>';
    render();
  }
  setTimeout(function(){ hpUpdate('A',hpOf(A),hpOf(A)); hpUpdate('B',hpOf(B),hpOf(B)); step(); },420);
}

/* 英语发音：优先用嵌入的 ASSET_VOICE；否则用系统 TTS。
   iPhone「添加到主屏幕」要求第一次 speak() 必须在用户点击的同步调用栈里，
   因此不能先 404 再异步兜底（会静音）。 */
var voiceEl=null, voicePrimed=false, enVoice=null, voiceTimer=null;
function soundEnabled(){ return !(S&&S.sound===false); }
function refreshEnVoice(){
  try{
    if(!window.speechSynthesis) return null;
    var vs=window.speechSynthesis.getVoices()||[], i;
    enVoice=null;
    for(i=0;i<vs.length;i++){ if(/en[-_]US/i.test(vs[i].lang)){ enVoice=vs[i]; break; } }
    if(!enVoice){ for(i=0;i<vs.length;i++){ if(/^en/i.test(vs[i].lang)){ enVoice=vs[i]; break; } } }
  }catch(e){}
  return enVoice;
}
try{
  if(window.speechSynthesis){
    refreshEnVoice();
    window.speechSynthesis.addEventListener('voiceschanged', refreshEnVoice);
  }
}catch(e){}
function primeVoice(){
  try{ unlockAudio(); }catch(e){}
  if(voicePrimed) return;
  voicePrimed=true;
  try{
    if(window.speechSynthesis){
      refreshEnVoice();
      var u=new SpeechSynthesisUtterance(' ');
      u.volume=0; u.rate=2; u.lang='en-US';
      if(enVoice) u.voice=enVoice;
      window.speechSynthesis.speak(u);
      window.speechSynthesis.cancel();
    }
  }catch(e){}
}
['pointerdown','touchstart','click'].forEach(function(ev){
  document.addEventListener(ev,function(){ try{ unlockAudio(); primeVoice(); }catch(e){} },{capture:true,passive:true});
});
function speakFallback(text, sync){
  if(!text||!soundEnabled()) return;
  try{
    if(!window.speechSynthesis) return;
    refreshEnVoice();
    var u=new SpeechSynthesisUtterance(String(text));
    u.lang='en-US'; u.rate=0.88;
    if(enVoice) u.voice=enVoice;
    window.speechSynthesis.cancel();
    if(sync){
      window.speechSynthesis.speak(u);
    }else{
      try{ clearTimeout(voiceTimer); }catch(e){}
      voiceTimer=setTimeout(function(){
        try{ window.speechSynthesis.speak(u); }catch(e){}
      },60);
    }
  }catch(e){}
}
function playVoice(name,text,sync){
  if(!soundEnabled()) return;
  var wantSync=(sync!==false);
  try{
    stopVoice();
    /* 若打包了嵌入语音（与 ASSET_CRY 同思路），优先播放录音 */
    if(typeof ASSET_VOICE!=='undefined'&&ASSET_VOICE&&name&&ASSET_VOICE[name]){
      voiceEl=new Audio(ASSET_VOICE[name]);
      voiceEl.volume=1;
      var p=voiceEl.play();
      if(p&&p.catch){ p.catch(function(){ speakFallback(text||'', wantSync); }); }
      return;
    }
    /* 本包未附带 assets/voice，直接同步 TTS，避免 iOS 异步兜底被静音 */
    speakFallback(text||'', wantSync);
  }catch(e){ speakFallback(text||'', wantSync); }
}
function stopVoice(){
  try{ clearTimeout(voiceTimer); }catch(e){}
  try{ if(voiceEl){ voiceEl.pause(); voiceEl.currentTime=0; } }catch(e){}
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
}

function meetRender(fromGesture){

  if(dots){

    }).join('');

function trMix(c,to,f){
  function p(x){
    x=String(x).replace('#','');
    if(x.length===3) x=x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
    return [parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)];

  var a=p(c), b=p(to);

    return h.length===1?'0'+h:h;
  }).join('');
}

/* ---------- 每日过场动画 ---------- */
/* 魔法层：环绕的星屑 + 上升的光点 + 旋转光环，让过场有“魔法少女变身”的氛围 */
function magicLayerHTML(sc){
  var s='';
  for(var i=0;i<16;i++){
    var x=(6+Math.random()*88).toFixed(1), y=(10+Math.random()*70).toFixed(1);
    var sz=(10+Math.random()*16)|0, d=(Math.random()*2.6).toFixed(2), dur=(2.2+Math.random()*1.8).toFixed(2);
    s+='<span class="mg-spark" style="left:'+x+'%;top:'+y+'%;font-size:'+sz+'px;animation-duration:'+dur+'s;animation-delay:'+d+'s">'+(i%3===0?'✧':(i%3===1?'✦':'❋'))+'</span>';
  }
  for(var j=0;j<14;j++){
    var mx=(8+Math.random()*84).toFixed(1), md=(Math.random()*3).toFixed(2), ms=(5+Math.random()*9).toFixed(1), mdu=(2.6+Math.random()*2.4).toFixed(2);
    s+='<span class="mg-mote" style="left:'+mx+'%;width:'+ms+'px;height:'+ms+'px;animation-duration:'+mdu+'s;animation-delay:'+md+'s"></span>';
  }
  s+='<div class="mg-ring r1"></div><div class="mg-ring r2"></div>';
  s+='<div class="mg-aura"></div>';
  s+='<div class="mg-flash"></div>';
  return '<div class="tr-magic">'+s+'</div>';
}
function playTrainerScene(replay,afterClose){
  var t=trainerS();
  if(!t.gender){ openGenderPicker(); return; }
  syncTrainerOutfits();
  var d=parseDate(todayStr()).getDay();
  var sc=TRAINER_SCENES[d]; var o=outfitById(t.outfit);
  var props=sc.props.map(function(p,i){
    return '<span class="tr-prop" style="left:'+(10+i*30)+'%;animation-delay:'+(i*0.6)+'s">'+p+'</span>';
  }).join('');
  var fx='';
  if(sc.act==='run') fx='<span class="tr-fxbit" style="left:16%;bottom:14px;animation-delay:.2s">💨</span><span class="tr-fxbit" style="left:24%;bottom:6px;animation-delay:.7s">💨</span>';
  if(sc.act==='throw') fx='<span class="tr-ball">'+ballIco('poke',22)+'</span>';
  if(sc.act==='highfive'){
    var pal=S.team.length?S.team[Math.floor(Math.random()*S.team.length)]:null;
    fx=(pal?'<img class="tr-pal" '+pokeImgAttrs(pal.sid)+'>':'')+'<span class="tr-fxbit" style="left:58%;top:44%;animation-delay:.5s">🤝</span>';
  }
  if(sc.act==='jump') fx='<span class="tr-fxbit" style="left:50%;top:18%;animation-delay:.4s">🌟</span><span class="tr-fxbit" style="left:26%;top:30%;animation-delay:.8s">✨</span>';
  if(sc.act==='polish') fx='<span class="tr-fxbit" style="left:38%;top:40%;animation-delay:.3s">✨</span><span class="tr-fxbit" style="left:62%;top:34%;animation-delay:.7s">✨</span><span class="tr-fxbit" style="left:50%;top:24%;animation-delay:1.1s">🏅</span>';
  if(sc.act==='cheer') fx='<span class="tr-fxbit" style="left:20%;top:26%;animation-delay:.3s">🎉</span><span class="tr-fxbit" style="left:70%;top:22%;animation-delay:.8s">🎊</span>';
  if(sc.act==='star') fx='<span class="tr-meteor">🌠</span><span class="tr-fxbit" style="left:64%;top:20%;animation-delay:.9s">✨</span>';
  var magic=magicLayerHTML(sc);
  var m=showModal('<div class="dialog" id="trDlg" style="padding:14px">'+
    '<div class="tr-stage" style="background:'+sc.bg+'">'+
      sceneHTML(sc.bg)+
      '<div class="vid-tint" style="background:'+(sc.tint||'rgba(255,255,255,.06)')+';"></div>'+
      '<div class="vid-veil"></div>'+
      '<div class="tr-tag" style="color:'+(sc.dark?'#fff':'#5d4300')+';background:'+(sc.dark?'rgba(0,0,0,.34)':'rgba(255,255,255,.8)')+'">'+sc.nm+'</div>'+
      '<div class="tr-wear" style="color:'+(sc.dark?'#fff':'#5d4300')+';background:'+(sc.dark?'rgba(0,0,0,.34)':'rgba(255,255,255,.8)')+'">'+o.ic+' '+esc(o.nm)+'</div>'+
      '<div class="tr-sky">'+props+'</div>'+
      magic+
      '<div class="tr-platform"></div>'+
      '<div class="tr-actor act-'+sc.act+'">'+trainerSVG(t.gender,t.outfit)+'</div>'+
      '<div class="tr-glow" style="background:radial-gradient(ellipse at 50% 75%,'+o.acc+'88 0%,'+o.main+'44 42%,rgba(0,0,0,0) 72%)"></div>'+
      '<div class="tr-fx">'+fx+'</div>'+
      '<div class="tr-ground"></div>'+
      '<div class="tr-sheen"></div>'+
    '</div>'+
    '<p class="lead" id="trCap" style="margin:10px 0 4px;min-height:38px">'+esc(sc.cap)+'</p>'+
    '<div class="dlg-actions"><button class="btn btn-yellow btn-block" onclick="closeTrScene(true)">🔁 再看一遍</button>'+
    '<button class="btn btn-primary btn-block" onclick="closeTrScene(false)">好啦！</button></div></div>');
  window.__trAfter=m; window.__trCb=afterClose||null;
  if(replay) sfxClick(); else sfxOk();
  t.lastScene=todayStr(); save();
  setTimeout(function(){ sfxLevel(); },600);
}
function closeTrScene(again){
  var cb=window.__trCb||null;
  closeModal(); window.__trCb=null;
  if(again){ setTimeout(function(){ playTrainerScene(true,cb); },80); }
  else if(cb){ cb(); }
}

function sfxSkill(type){

      note(160,0.32,0.16,'triangle',0.34);

      note(880,0.26,0.2,'sine',0.36);

      note(1180,0.3,0.22,'sine',0.36);

      '<div class="sk-hint">点击任意处关闭</div>';

/* 技能演示：用 data-* 委托，避免 inline onclick 引号/移除节点导致无响应 */
(function bindSkillDemoClicks(){

function render(){

function openBattleModal(g,win){
  try{ sfxBattleArm(); }catch(e){}
  var lines;
  if(win){
    lines=['🏟️ 来到'+g.name+'！','馆主 '+g.leader+' 派出强大的宝可梦！','你的伙伴们齐心协力！','💥 砰！一招命中！','🎉 战胜 '+g.leader+'！'];
  }else{
    lines=['🏟️ 来到'+g.name+'！','馆主 '+g.leader+' 的宝可梦好强…','伙伴们勇敢出击，但还差一点！','先回去打卡练级，再战一次吧！'];
  }
  var m=showModal('<div class="dialog"><h3>⚔️ '+g.name+'</h3><ul class="battle-log" id="battleLog"></ul><div id="battleEnd"></div></div>');
  try{ sfxBattleStart(); }catch(e0){}
  var i=0;
  (function nextLine(){
    if(i>=lines.length){
      if(win){ winBattle(g); }
      else{ try{ sfxBattleFaint(); }catch(e){} $('battleEnd').innerHTML='<div class="dlg-actions"><button class="btn btn-primary btn-block" onclick="closeModal()">回去练级！</button></div>'; }
      return;
    }
    var line=lines[i];
    if(i===0){ try{ sfxBattleMove(g.type||'一般'); }catch(e1){} }
    else if(line.indexOf('砰')>=0||line.indexOf('命中')>=0){ try{ sfxBattleHit(true); }catch(e2){} }
    else if(line.indexOf('战胜')>=0){ try{ sfxBattleWin(); }catch(e3){} }
    else if(line.indexOf('差一点')>=0||line.indexOf('练级')>=0){ try{ sfxBattleHit(false); }catch(e4){} }
    else { try{ sfxBattleMove(g.type||'一般'); }catch(e5){} }
    var li=document.createElement('li'); li.textContent=line; $('battleLog').appendChild(li);
    i++;
    setTimeout(nextLine, win?750:900);
  })();
}

function pickArena(who,i){
  if(who==='A'){ if(i===arenaB){ arenaB=arenaA; } arenaA=i; }

  sfxClick(); render();
}
function startArena(){
  try{ sfxBattleArm(); }catch(e){}
  var bw=battleWindow();
  if(!bw.open){ toast('对战只在每天 20:00-22:00 开放哦'); return; }
  if(S.team.length<2){ toast('至少要有两只宝可梦才能对战'); return; }
  var t=todayStr();
  if(!S.arena||S.arena.date!==t) S.arena={date:t,count:0,xpGiven:false};
  if(S.arena.count>=3){ toast('今天已经打了 3 场啦，明天再来吧'); return; }
  if(arenaA>=S.team.length) arenaA=0;
  if(arenaB>=S.team.length||arenaB===arenaA) arenaB=(arenaA+1)%S.team.length;
  var A=S.team[arenaA], B=S.team[arenaB];
  var rewardOK=!S.arena.xpGiven;
  S.arena.count++; save(); render();
  var sim=simBattle(A,B);
  playArena(A,B,sim,rewardOK);
}

/* ================= 钓鱼（每天 3 次 · 可切磋 / 可捕捉） ================= */
var FISH_DAILY=3;
/* 只钓水系宝可梦：越稀有权重越低 */
var FISH_POOL=[
  {w:26,v:'magikarp'},{w:14,v:'poliwag'},{w:12,v:'psyduck'},{w:10,v:'goldeen'},
  {w:9,v:'krabby'},{w:9,v:'staryu'},{w:8,v:'shellder'},{w:8,v:'horsea'},
  {w:7,v:'seel'},{w:7,v:'slowpoke'},
  {w:5,v:'poliwhirl'},{w:4,v:'golduck'},{w:4,v:'seaking'},{w:4,v:'kingler'},
  {w:4,v:'seadra'},{w:3,v:'dewgong'},{w:3,v:'cloyster'},{w:3,v:'slowbro'},{w:3,v:'wartortle'},
  {w:2,v:'gyarados'},{w:2,v:'starmie'},{w:2,v:'vaporeon'},{w:2,v:'poliwrath'},
  {w:1,v:'lapras'},{w:1,v:'blastoise'}
];
function fishReset(){
  var t=todayStr();
  if(!S.fish||S.fish.date!==t){ S.fish={date:t,used:0}; save(); }
  return S.fish;
}
function fishLeft(){ return Math.max(0,FISH_DAILY-fishReset().used); }
var fishPick=0;                       /* 出战伙伴下标 */
function fishFoe(){
  var sid=pickWeighted(FISH_POOL);
  var base=avgLevel()||5;
  var lv=Math.max(3,Math.min(40,base+rnd(3)-1));
  return {id:'foe_'+uid(),sid:sid,nick:spec(sid).name,level:lv,xp:0,source:'fish'};
}
function fishCatchInfo(sid){
  var w=26, i;
  for(i=0;i<FISH_POOL.length;i++){ if(FISH_POOL[i].v===sid){ w=FISH_POOL[i].w; break; } }
  if(w<=1) return {zone:14,catchRate:0.28};
  if(w<=2) return {zone:18,catchRate:0.42};
  if(w<=5) return {zone:22,catchRate:0.55};
  if(w<=10) return {zone:28,catchRate:0.7};
  return {zone:34,catchRate:0.85};
}
function fishActsHTML(){
  var me=S.team[fishPick]||S.team[0];
  var balls=S.items.vouchers||0, rares=S.items.rareVouchers||0;
  var chips='';
  if(S.team.length>1){
    if(fishPick>=S.team.length) fishPick=0;
    chips='<div style="font-size:12.5px;font-weight:800;color:#0d5f7a;margin:8px 0 6px">选择出战伙伴</div>'+
      '<div class="mon-pick-grid" style="margin:0 0 10px">'+S.team.map(function(m,i){
        return carePickHTML(m,{on:i===fishPick,onclick:'fishPickMon('+i+')'});
      }).join('')+'</div>';
  }
  return chips+
    '<button class="btn btn-primary btn-block btn-lg" onclick="fishFight()">⚔️ 派 '+(me?esc(me.nick):'伙伴')+' 比试一场</button>'+
    '<button class="btn btn-green btn-block" '+(balls>0?'':'disabled')+' onclick="fishCatch(false)">'+ballLabel('poke','精灵球捕捉（'+balls+'）')+'</button>'+
    (rares>0?'<button class="btn btn-yellow btn-block" onclick="fishCatch(true)">'+ballLabel('master','大师球捕捉（'+rares+'）')+'</button>':'')+
    '<button class="btn btn-gray btn-block" onclick="fishRelease()">🐟 放它回去</button>';
}
function fishStageHTML(kind,foe){
  var water='<div class="fish-far"></div>'+
    '<span class="fish-lily" style="left:8%;bottom:14%;animation-delay:.2s">🌿</span>'+
    '<span class="fish-lily" style="right:11%;bottom:20%;animation-delay:1.1s">🪷</span>'+
    '<span class="fish-lily" style="left:72%;bottom:8%;animation-delay:2s">🌱</span>';
  if(kind==='wait'){
    return '<div class="fish-stage" id="fishStage">'+water+
      '<span class="fish-bob" id="fishBob" style="left:50%;top:34%;transform:translateX(-50%)">🎣</span>'+
      '<span class="fish-splash" id="fishSplash">💦</span></div>';
  }
  if(kind==='bite'){
    return '<div class="fish-stage" id="fishStage">'+water+
      '<span class="fish-bob bite" id="fishBob" style="left:50%;top:46%;transform:translateX(-50%)">🎣</span>'+
      '<span class="fish-splash go" id="fishSplash">💦</span></div>';
  }
  /* 上钩：把宝可梦亮出来 */

      '<img '+pokeImgAttrs(foe.sid)+'>'+

    '</div></div>';

function startFish(){
  sfxClick();
  if(!S.team.length){ toast('先要有伙伴才能钓鱼哦'); return; }
  if(fishLeft()<=0){ toast('今天已经钓满 '+FISH_DAILY+' 次啦，明天再来'); return; }
  fishReset().used++; save();
  showModal('<div class="dialog" id="fishDlg">'+
    '<h3 style="margin:0 0 8px">🎣 江边钓鱼</h3>'+
    fishStageHTML('wait')+
    '<p class="lead" id="fishCap" style="margin-top:10px">浮标静静地漂在水面上…<br>今天还能钓 <b>'+fishLeft()+'</b> 次。</p>'+
    '<div class="dlg-actions" id="fishActs">'+
      '<button class="btn btn-primary btn-block btn-lg" onclick="fishCast()">抛竿！</button>'+
      '<button class="btn btn-gray btn-block" onclick="closeModal();render()">收杆回家</button>'+
    '</div></div>');

}
function fishCast(){
  sfxClick();
  var cap=$('fishCap'), acts=$('fishActs'), bob=$('fishBob');
  if(!cap||!acts) return;
  acts.innerHTML='';
  cap.innerHTML='抛竿…等浮标动一下。<br><span style="font-size:12.5px;color:#8a7a6a">屏住呼吸哦</span>';
  if(bob){ bob.style.top='46%'; bob.style.left='46%'; }
  beep(520,0.1,'triangle',0.07);
  /* 随机等待后咬钩 */
  setTimeout(function(){
    if(!$('fishDlg')) return;
    var b=$('fishBob');
    if(b) b.classList.add('bite');
    var sp=$('fishSplash');
    if(sp){ sp.classList.remove('go'); void sp.offsetWidth; sp.classList.add('go'); }
    beep(760,0.1,'square',0.09);
    setTimeout(function(){ beep(560,0.12,'square',0.08); },150);
    var cap2=$('fishCap');
    if(cap2) cap2.innerHTML='浮标猛地沉下去了！<br><b style="color:#0d5f7a">有东西上钩了！</b>';
    setTimeout(fishHook,900);
  }, 900+Math.random()*900);
}
function fishHook(){
  if(!$('fishDlg')) return;
  var foe=fishFoe();
  window.__fishFoe=foe;
  var stage=$('fishStage'), cap=$('fishCap'), acts=$('fishActs');
  if(!stage||!acts) return;
  /* 替换整个舞台为"上钩"画面 */
  stage.outerHTML=fishStageHTML('done',foe);
  sfxCatch();
  if(cap) cap.innerHTML='钓到了 <b>'+esc(foe.nick)+'</b>！（Lv.'+foe.level+'）<br><span style="font-size:12.5px;color:#0d5f7a">可以比试拿经验，也可以丢出精灵球捕捉带走！</span>';
  acts.innerHTML=fishActsHTML();
}
function fishPickMon(i){
  sfxClick();
  fishPick=i;
  var acts=$('fishActs');
  if(!acts) return;
  acts.innerHTML=fishActsHTML();
}
function fishRelease(){
  sfxClick();
  window.__fishFoe=null;
  toast('你把它放回了水里，它甩甩尾巴游走了');
  closeModal(); render();
}
function fishFight(){
  try{ sfxBattleArm(); }catch(e){}

  var me=S.team[fishPick]||S.team[0];
  if(!me){ toast('没有可以出战的伙伴'); return; }
  var sim=simBattle(me,foe);

function fishCatch(useRare){
  sfxClick();
  var foe=window.__fishFoe;
  if(!foe){ toast('它已经游走了'); return; }
  if(useRare){
    if((S.items.rareVouchers||0)<=0){ toast('没有大师球了'); return; }
    S.items.rareVouchers--;
  }else{

    S.items.vouchers--;
  }
  save();
  var rates=fishCatchInfo(foe.sid);

  var m=showModal('<div class="dialog" id="catchDlg"><div class="catch-stage" id="catchStage">'+

    '<h3 style="margin-top:6px">钓到的 '+esc(sp.name)+'！</h3>'+
    '<p class="lead" style="display:flex;flex-direction:column;align-items:center;gap:6px">江边浪花四溅…<br><span style="display:inline-flex;align-items:center;gap:6px">准备好丢出 '+ballIco(useRare?'master':'poke',20)+(useRare?' 大师球':' 精灵球')+' 了吗？</span></p>'+
    '<div class="dlg-actions"><button class="btn btn-primary btn-block" onclick="catchAim()">💪 准备好啦！</button></div></div></div>');

    '<p class="lead" style="display:flex;flex-direction:column;align-items:center;gap:6px">草丛里传来沙沙声…<br><span style="display:inline-flex;align-items:center;gap:6px">准备好 '+ballIco(useRare?'master':'poke',20)+(useRare?' 大师球':' 精灵球')+' 了吗？</span></p>'+

function catchAim(){
  sfxClick();
  var c=window.__catch;
  var ball=c.ball||'poke';
  var ballName=ball==='master'?'大师球':'精灵球';
  $('catchStage').innerHTML='<h3 style="margin-top:4px">瞄准！</h3>'+
    '<p class="lead">等红色指针移动到绿色区域时投球！</p>'+
    '<div class="aim-box"><div class="aim-hint"><span>太早</span><span>命中区</span><span>太晚</span></div>'+
    '<div class="aim"><div class="target" id="aimTarget" style="left:'+(50-c.e.zone/2)+'%;width:'+c.e.zone+'%"></div><div class="marker" id="aimMarker" style="left:0%"></div></div></div>'+
    '<div class="dlg-actions"><button class="btn btn-primary btn-block btn-lg" onclick="catchThrow()">'+ballLabel(ball,'投出'+ballName+'！',20)+'</button></div>';
  var pos=8,dir=1,speed=1.4;
  c.aim={pos:pos,dir:dir,speed:speed};
  c.timer=setInterval(function(){
    var a=c.aim; a.pos+=a.speed*a.dir;
    if(a.pos>94){a.pos=94;a.dir=-1;} if(a.pos<4){a.pos=4;a.dir=1;}
    var mk=$('aimMarker'); if(mk) mk.style.left=a.pos+'%';
  },16);
}
function catchThrow(){
  sfxClick();
  var c=window.__catch;
  clearInterval(c.timer);
  var pos=c.aim.pos;
  var zone=c.e.zone;
  var hit=Math.abs(pos-50)<=zone/2;
  var stage=$('catchStage');
  if(!hit){
    stage.innerHTML='<div class="big">😮💨</div><h3>哎呀，偏了！</h3><p class="lead" style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="display:inline-flex;align-items:center;gap:5px">'+ballIco(c.ball||'poke',20)+' 擦着飞过去了…</span><br>'+esc(spec(c.e.sid).name)+'跑掉了。</p>'+
      '<div class="dlg-actions"><button class="btn btn-primary btn-block" onclick="closeModal()">下次再来！</button></div>';
    sfxBad(); render(); return;
  }
  var success=Math.random()<c.e.catchRate;
  if(success){
    sfxCatch(); confetti();
    var sp=spec(c.e.sid);
    var src=c.e.source||'wild';
    var lv=c.e.level||5;
    stage.innerHTML='<div class="big" style="display:flex;align-items:center;justify-content:center;gap:8px">'+ballIco(c.ball||'poke',36)+'🎉</div><h3>抓到啦！</h3><p class="lead">'+esc(sp.name)+(src==='fish'?('（Lv.'+lv+'）'):'')+' 加入了你的队伍！</p>';
    setTimeout(function(){
      var r=tryAddMon(c.e.sid,src,lv);
      if(!r.boxed){
        stage.innerHTML+='<div class="dlg-actions"><button class="btn btn-primary btn-block" onclick="closeModal()">太棒了！</button></div>';
        render();
      }else{
        stage.innerHTML='<div class="big" style="display:flex;align-items:center;justify-content:center;gap:8px">'+ballIco(c.ball||'poke',36)+'🎉</div><h3>抓到啦！</h3><p class="lead">'+esc(sp.name)+' 已存入<b>图鉴</b>保管！<br>队伍满了？可以替换队员上场，或随时在图鉴里切换。</p>'+
          '<div class="dlg-actions"><button class="btn btn-yellow btn-block" onclick="openReplace(\''+c.e.sid+'\',\''+src+'\')">🔄 挑选替换上场</button>'+
          '<button class="btn btn-primary btn-block" onclick="closeModal();go(\'dex\')">📖 去看看图鉴</button></div>';
        render();
      }
    },400);
  }else{
    sfxBad();
    stage.innerHTML='<div class="big">😢</div><h3>哎呀，跑掉了…</h3><p class="lead" style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="display:inline-flex;align-items:center;gap:5px">'+ballIco(c.ball||'poke',20)+' 晃了三次，还是被挣脱了！</span><br>下次见面一定抓住你！</p>'+
      '<div class="dlg-actions"><button class="btn btn-primary btn-block" onclick="closeModal()">没关系，继续！</button></div>';
    render();
  }
}
function openReplace(sid,source){
  sfxClick();
  /* 卡比兽：若已在盒子/队伍里，只做上场或提示，绝不再 new 一只 */
  if(sid==='snorlax'){
    var loc=findSnorlax();
    if(loc&&loc.where==='team'){ toast('卡比兽已经在队伍里啦'); return; }
    if(loc&&loc.where==='box'){ addFromBox(loc.i); return; }
  }
  /* 队伍满时 tryAddMon 已把新伙伴放进盒子：这里只换位，避免再造一只并弄丢旧伙伴 */
  var bi=findBoxedSid(sid);
  if(bi>=0){
    var swapOpts=S.team.map(function(m,i){
      return '<button class="btn btn-gray btn-block" style="justify-content:flex-start;display:flex;align-items:center;gap:10px" onclick="boxSwap('+bi+','+i+')">'+pokeImgHTML(m.sid,'style="width:38px;height:38px;object-fit:contain;border-radius:50%"')+' '+esc(m.nick)+'（Lv.'+m.level+'）</button>';
    }).join('');
    showModal('<div class="dialog"><h3>队伍满啦</h3><p class="lead">新伙伴已在图鉴盒子里。选一位伙伴回盒子休息，让它上场：</p><div class="dlg-actions" style="max-height:40dvh;overflow:auto">'+swapOpts+'</div>'+
      '<div class="dlg-actions"><button class="btn btn-gray btn-block" onclick="closeModal()">先留在盒子里</button></div></div>');
    return;
  }
  var opts=S.team.map(function(m,i){
    return '<button class="btn btn-gray btn-block" style="justify-content:flex-start;display:flex;align-items:center;gap:10px" onclick="doReplace('+i+',\''+sid+'\',\''+source+'\')">'+pokeImgHTML(m.sid,'style="width:38px;height:38px;object-fit:contain;border-radius:50%"')+' '+esc(m.nick)+'（Lv.'+m.level+'）</button>';
  }).join('');
  showModal('<div class="dialog"><h3>队伍满啦</h3><p class="lead">选择一位伙伴送回图鉴休息，让新朋友加入：</p><div class="dlg-actions" style="max-height:40dvh;overflow:auto">'+opts+'</div></div>');
}
function doReplace(idx,sid,source){
  sfxOk();
  if(sid==='snorlax'){
    var loc=findSnorlax();
    if(loc&&loc.where==='team'){ toast('卡比兽已经在队伍里啦'); closeModal(); return; }
    if(loc&&loc.where==='box'){
      boxSwap(loc.i,idx); return;
    }
  }
  var bi=findBoxedSid(sid);
  if(bi>=0){ boxSwap(bi,idx); return; }
  var old=replaceMon(idx,sid,source);
  closeModal(); closeModal();
  var sp=spec(sid);
  toast(esc(sp.name)+' 上场'+(old?'，'+esc(old.nick)+' 回到图鉴休息':'')+'！');
  render();
}

function openReject(id){
  sfxClick();
  showModal('<div class="dialog"><h3>✖ 驳回任务</h3>'+
    '<div class="field"><textarea id="rejectNote" rows="2" maxlength="40" placeholder="给孩子留句话（可不填），比如：口算再检查一遍"></textarea></div>'+
    '<div class="dlg-actions"><button class="btn btn-red btn-block" onclick="doReject(\''+id+'\')">确认驳回</button>'+
    '<button class="btn btn-gray btn-block" onclick="closeModal()">取消</button></div></div>');
}
function doReject(id){
  sfxBad();
  var hw=S.homework.filter(function(h){return h.id===id;})[0];
  if(!hw||hw.status!=='pending')return;
  var n=$('rejectNote'); hw.note=(n?n.value:'').trim();
  hw.status='rejected'; hw.reviewedAt=nowHM();
  save(); closeModal(); render();
  toast('已驳回，孩子会看到留言重新提交');
}
function showResultModal(hw,xp,events,prize,deduct,voucher){
  var head='<div class="big-emoji">✨</div><h3>'+(deduct?'已通过（部分经验）':'审核通过！')+'</h3>'+
    '<p class="lead">「'+esc(hw.desc)+'」获得 <b style="color:#43a047">+'+xp+' 经验</b>'+(hw.fast?'（含快手奖励 ×'+S.fastMult+'）':'')+'</p>';
  var voucherHTML='';
  if(voucher){
    voucherHTML='<div style="background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border:1.5px solid #a5d6a7;border-radius:16px;padding:10px 12px;margin:10px 0 0">'+
      '<b style="color:#2e7d32;font-size:15px;display:inline-flex;align-items:center;gap:6px">'+ballIco('poke',20)+' 每日挑战达成！获得精灵球 ×'+dailyReward()+'</b>'+
      '<div style="font-size:12.5px;color:#33691e;font-weight:600;margin-top:2px">今天已完成 '+dailyTarget()+' 个任务，精灵球已放入背包，周末野外探险可以用！</div></div>';
  }
  var evs='';
  events.forEach(function(ev){
    if(ev.type==='evo'){
      evs+='<p class="lead" style="color:#8e24aa;font-weight:900">'+esc(ev.mon.nick)+' 进化了！恭喜 '+esc(ev.mon.nick)+' ！</p>';
    }else if(ev.type==='levelmove'){
      evs+='<p class="lead" style="color:#a06800;font-weight:900">'+esc(ev.mon.nick)+' 升到 Lv.'+ev.newLevel+'，学会了新招式「'+esc(ev.move)+'」！</p>';
    }else if(ev.type==='level'){
      evs+='<p class="lead" style="color:#1e88e5;font-weight:900">'+esc(ev.mon.nick)+' 升到 Lv.'+ev.newLevel+'！</p>';
    }
  });
  var prizeHTML='';
  if(prize){
    prizeHTML='<p class="lead" style="color:#c62828;font-weight:900;margin-top:8px">🔥 连续打卡 '+S.streakTarget+' 天！连击大奖解锁！</p>'+
      '<div class="dlg-actions" style="flex-direction:row;flex-wrap:wrap">'+PRIZE_POOL.map(function(p){
        return '<button class="btn btn-yellow" style="flex:1 1 40%;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:6px" onclick="claimPrizeBtn(\''+p.sid+'\')">'+pokeImgHTML(p.sid,'style="width:32px;height:32px;object-fit:contain;border-radius:50%"')+' '+p.nm+'</button>';
      }).join('')+'</div><p class="lead" style="font-size:12px;margin-top:6px">选一只你喜欢的加入队伍吧！</p>';
  }
  var closeBtn=prize?'':'<button class="btn btn-primary btn-block" onclick="closeModal()">太棒了！</button>';
  var m=showModal('<div class="dialog">'+head+evs+voucherHTML+prizeHTML+'<div class="dlg-actions">'+closeBtn+'</div></div>');
  if(events.some(function(e){return e.type==='evo';})){ sfxEvo(); confetti(); }
  else if(events.length){ sfxLevel(); confetti(); }
  else { sfxOk(); }
  if(prize){ window.__prize={sid:null}; }
}
function claimPrizeBtn(sid){
  var r=claimPrize(sid);

    showModal('<div class="dialog"><div class="big-emoji">'+pokeImgHTML(sid,'style="width:110px;height:110px;object-fit:contain"')+'</div><h3>'+esc(spec(sid).name)+' 已存入图鉴！</h3><p class="lead">队伍满了，连击大奖伙伴先在盒子里休息。<br>你可以挑选替换上场，或稍后再去图鉴叫它。</p><div class="dlg-actions"><button class="btn btn-yellow btn-block" onclick="openReplace(\''+sid+'\',\'prize\')">🔄 挑选替换上场</button><button class="btn btn-primary btn-block" onclick="closeModal();go(\'dex\')">📖 去图鉴看看</button></div></div>');

}

var recFilter='all';
function viewRecordsHTML(){
  var sz=stats();
  var st=S.streak;
  var list=S.homework.slice().sort(function(a,b){return b.id-a.id;});
  if(recFilter!=='all'){ list=list.filter(function(h){return h.status===recFilter;}); }
  var rows=list.slice(0,60).map(function(h){
    var stTxt,stCls;
    if(h.status==='pending'){stTxt='待审核';stCls='pending';}
    else if(h.status==='approved'){stTxt='通过 +'+h.xp;stCls='approved';}
    else if(h.status==='deducted'){stTxt='扣减 +'+h.xp;stCls='deducted';}
    else{stTxt='驳回';stCls='rejected';}
    return '<tr><td style="width:22%">'+fmtCN(h.date)+'<div style="font-size:10.5px;color:#b0a090">'+h.submitAt+(h.fast?'⚡':'')+'</div></td>'+
      '<td style="width:18%">'+esc(h.subject)+'</td>'+
      '<td style="width:40%">'+esc(h.desc)+(h.note?'<div style="font-size:10.5px;color:#c62828">'+esc(h.note)+'</div>':'')+'</td>'+
      '<td style="width:20%"><span class="status '+stCls+'" style="font-size:10px">'+stTxt+'</span></td></tr>';
  }).join('')||'<tr><td colspan="4" style="text-align:center;color:#b0a090;padding:20px 0">暂无记录</td></tr>';
  var days='';
  for(var i=6;i>=0;i--){
    var d=addDays(todayStr(),-i);
    var ok=S.homework.some(function(h){return h.date===d&&(h.status==='approved'||h.status==='deducted');});
    var isT=d===todayStr();
    days+='<div style="text-align:center;flex:1"><div style="width:22px;height:22px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;background:'+(ok?'linear-gradient(135deg,#ffe27a,#ffcb05)':'#eee')+';color:'+(ok?'#5d4300':'#b0a090')+';border:'+(isT?'2px solid #e3350d':'none')+'">'+(ok?'✓':('日一二三四五六'[parseDate(d).getDay()]))+'</div><div style="font-size:10px;color:#b0a090;margin-top:2px">'+((+d.split('-')[2]))+'日</div></div>';
  }
  return '<div class="view">'+
    '<div class="page-title"><h2>成长记录</h2><span class="sub">'+S.childName+' 的成长足迹</span></div>'+
    '<div class="card"><div class="stat-grid">'+
      '<div class="stat-cell"><b>'+sz.xp+'</b><span>累计经验</span></div>'+
      '<div class="stat-cell"><b>'+sz.approved+'</b><span>已通过任务</span></div>'+
      '<div class="stat-cell"><b>'+st.record+'</b><span>连击纪录</span></div>'+
      '<div class="stat-cell"><b>'+S.badges.length+'</b><span>道馆徽章</span></div>'+
    '</div></div>'+
    '<div class="card"><h3>🔥 最近 7 天打卡</h3><div style="display:flex;gap:4px">'+days+'</div>'+
    '<p style="font-size:12.5px;color:#8a7a6a;margin:10px 0 0;font-weight:600">连续打卡 '+st.count+' 天，累计满 '+S.streakTarget+' 天领一次连击大奖（已领 '+Math.floor(st.lastPrize/S.streakTarget)+' 次）</p></div>'+
    '<div class="card"><h3>任务明细</h3>'+
      '<div class="chips" style="margin-bottom:8px">'+
        ['all','pending','approved','deducted','rejected'].map(function(f){
          var nm={all:'全部',pending:'待审核',approved:'已通过',deducted:'扣减',rejected:'驳回'}[f];
          return '<button class="chip-opt'+(recFilter===f?' on':'')+'" onclick="setFilter(\''+f+'\')">'+nm+'</button>';
        }).join('')+'</div>'+
      '<table class="rec"><colgroup><col style="width:22%"><col style="width:18%"><col style="width:40%"><col style="width:20%"></colgroup>'+
      '<thead><tr><th>日期</th><th>任务</th><th>完成内容</th><th>状态</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '</div>';
}

function applyChildSettingsForm(){
  var n=$('setName'); if(n){ var nm=n.value.trim(); if(nm) S.childName=nm; }
  var p=$('setPin'); if(p) S.pin=p.value.trim();
  return null;
}
function applyRulesForm(){
  var d=$('setDeadline'), b=$('setBase'), st=$('setStreak'), f=$('setFast');
  if(!d&&!b&&!st&&!f) return null;
  if(d){
    var dv=(d.value||'').trim();
    if(!dv) return '请填写快手奖励截止时间';
    S.deadline=dv;
  }
  if(b){
    var bv=parseInt(String(b.value).trim(),10);
    if(!(bv>=5&&bv<=100)) return '单次任务基础经验请填 5～100';
    S.baseXP=bv;
  }
  if(st){
    var sv=parseInt(String(st.value).trim(),10);
    if(!(sv>=3&&sv<=14)) return '连击大奖天数请填 3～14';
    S.streakTarget=sv;
  }
  if(f){
    var fm=parseFloat(String(f.value).trim());
    if(!(!isNaN(fm)&&fm>=1&&fm<=3)) return '快手经验倍率请填 1～3';
    S.fastMult=Math.round(fm*10)/10;
  }
  return null;
}
function saveSettings(){
  var err=applyChildSettingsForm()||applyRulesForm();
  if(err){ sfxBad(); toast(err); return; }
  var ak=activeKid(); if(ak){ ak.name=S.childName; saveKids(); }
  sfxOk(); save(); render(); toast('设置已保存（含激励规则）');
}
function saveRules(){
  var err=applyRulesForm();
  if(err){ sfxBad(); toast(err); return; }
  sfxOk(); save(); render(); toast('规则已保存：单次经验 '+S.baseXP+' · 倍率 ×'+S.fastMult);
}
function saveChallenge(){
  var t=parseInt($('setDailyTarget').value,10);
  var r=parseInt($('setDailyReward').value,10);
  var w=parseInt($('setWeekendFree').value,10);
  if(!(t>=1&&t<=20)){ toast('每日目标请填 1～20'); return; }
  if(!(r>=1&&r<=5)){ toast('精灵球个数请填 1～5'); return; }
  if(!(w>=0&&w<=7)){ toast('周末免费次数请填 0～7'); return; }
  S.dailyTarget=t; S.dailyReward=r; S.weekendFree=w;
  /* 若今天已达标但还没发精灵球（例如刚把目标从 7 改成 3），立刻补发 */
  var just=refreshDailyVoucher();
  sfxOk(); save(); render();
  toast(just?('挑战设置已保存，并补发了今日精灵球 ×'+dailyReward()):'挑战设置已保存');
}
function adjustVoucher(n){
  S.items.vouchers=Math.max(0,(S.items.vouchers||0)+n);
  sfxClick(); save(); render();
  toast('精灵球：'+S.items.vouchers+' 个');
}
function adjustRareVoucher(n){
  S.items.rareVouchers=Math.max(0,(S.items.rareVouchers||0)+n);
  sfxClick(); save(); render();
  toast('大师球：'+S.items.rareVouchers+' 个');
}
function addSubject(){
  var v=$('newSubj').value.trim();
  if(!v){toast('先输入任务名');return;}
  if(S.subjects.indexOf(v)>=0){toast('这个任务已经有了');return;}
  S.subjects.push(v); sfxOk(); save(); render();
}
function delSubject(s){
  if(S.subjects.length<=1){toast('至少保留 1 个任务');return;}
  S.subjects=S.subjects.filter(function(x){return x!==s;});
  sfxClick(); save(); render();
}
function toggleSound(){
  S.sound=!S.sound;
  SOUND=!!S.sound;
  if(S.sound){ primeVoice(); sfxOk(); } else { stopVoice(); }
  save(); render();
}
function exportSave(){
  var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='宝可梦激励-存档-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},800);
  toast('存档已导出');
}
function importSave(input){
  var f=input.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||!Array.isArray(d.team)){ throw new Error('bad'); }
      var k=activeKid();
      if(k){ localStorage.setItem(kidStorageKey(k.key),JSON.stringify(d)); }
      else{ localStorage.setItem(KEY,JSON.stringify(d)); }
      S=normalizeState(load()); save(); render();
      toast('存档导入成功！');
    }catch(e){ toast('存档文件格式不对'); }
  };
  r.readAsText(f);
  input.value='';
}
function confirmReset(){
  showModal('<div class="dialog"><h3>⚠️ 重置全部数据</h3><p class="lead">所有打卡记录、宝可梦、徽章都会清空，且无法恢复。</p>'+
    '<div class="dlg-actions"><button class="btn btn-red btn-block" onclick="doReset()">我确定，全部重置</button>'+
    '<button class="btn btn-gray btn-block" onclick="closeModal()">取消</button></div></div>');
}
function doReset(){
  resetAll(); sfxClick(); closeModal(); render(); toast('已重置，从新冒险开始！');
}

/* ================= 启动 ================= */
function init(){
  SOUND=!(S&&S.sound===false);
  cleanupGymSnorlaxDupes();
  renderHeader(); renderTabbar();
  var seal=checkSeal();
  if(seal==='joined'){
    setTimeout(function(){
      confetti(); sfxEvo();
      showModal('<div class="dialog"><div class="big-emoji">'+pokeImgHTML('snorlax','style="width:120px;height:120px;object-fit:contain"')+'</div><h3>卡比兽苏醒啦！</h3><p class="lead">坚持 7 天封印解除，卡比兽加入队伍！它想和你一起打卡升级！</p><div class="dlg-actions"><button class="btn btn-primary btn-block" onclick="closeModal()">欢迎！</button></div></div>');
    },300);
  }else if(seal==='boxed'||seal==='full'){
    setTimeout(function(){
      showModal('<div class="dialog"><div class="big-emoji">'+pokeImgHTML('snorlax','style="width:120px;height:120px;object-fit:contain"')+'</div><h3>卡比兽苏醒啦！</h3><p class="lead">队伍已经满了，卡比兽先住进<b>图鉴盒子</b>休息。<br>你可以随时去图鉴叫它上场，或在这里挑选替换。</p><div class="dlg-actions"><button class="btn btn-yellow btn-block" onclick="openReplace(\'snorlax\',\'gym\')">挑选替换上场</button><button class="btn btn-gray btn-block" onclick="closeModal();go(\'dex\')">📖 先去图鉴看看</button></div></div>');
    },300);
  }
  var egg=checkEgg();
  if(egg){
    var r=tryAddMon(egg,'egg');
    setTimeout(function(){
      if(r.ok){
        confetti(); sfxEvo();
        showModal('<div class="dialog"><div class="big-emoji">🥚💥</div><h3>神秘蛋孵化了！</h3><p class="lead">'+esc(spec(egg).name)+' 破壳而出，加入了队伍！</p><div class="dlg-actions"><button class="btn btn-primary btn-block" onclick="closeModal()">欢迎！</button></div></div>');
      }else{
        showModal('<div class="dialog"><div class="big-emoji">🥚💥</div><h3>神秘蛋孵化了！</h3><p class="lead">'+esc(spec(egg).name)+' 破壳而出，但队伍满了…</p><div class="dlg-actions"><button class="btn btn-yellow btn-block" onclick="openReplace(\''+egg+'\',\'egg\')">挑选替换</button><button class="btn btn-gray btn-block" onclick="closeModal()">先不带了</button></div></div>');
      }
    },300);
  }
  render();
  if(S.firstRun){ location.hash=''; }
  /* 每日遇见：孩子模式「当天第一次打开」自动出现大木博士。
     用 meet.autoDate 记住今天已经自动弹过，之后再打开 app 不再打扰；
     横幅入口随时可以手动进入。 */
  if(!S.firstRun&&viewMode==='child'&&!meetDone()){
    var _today=todayStr();
    if(!S.meet) S.meet={date:'',done:false,count:0,autoDate:''};
    if(S.meet.autoDate!==_today){
      S.meet.autoDate=_today; save();
      setTimeout(function(){
        var r=$('modalRoot');
        if(r&&!r.firstChild){ openMeet(); }
      },1100);
    }
  }
}
/* 保险：app 切到后台/被回收前，把进度强制落盘一次 */
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') save(); });
window.addEventListener('pagehide',function(){ save(); });
init();

</script>
