<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宝可梦激励</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-64.png" type="image/png">
<style>
/* ===== 基础 · 宝可梦游戏菜单风 ===== */
:root{
  --pk-red:#EE1515; --pk-red-d:#C62828; --pk-red-h:#FF4D3A;
  --pk-yellow:#FFCB05; --pk-yellow-d:#F5B700; --pk-yellow-s:#FFE27A;
  --pk-ink:#2A2420; --pk-ink-soft:#5C4E44;
  --pk-paper:#FFF8E7; --pk-paper-2:#FFFCF3;
  --pk-bg1:#9AD4FF; --pk-bg2:#C8E9A0; --pk-bg3:#F6F0C8;
  --pk-green:#3D9B4A; --pk-blue:#2B7DE9; --pk-gray:#9E9E9E;
  --pk-soft:#F3EAD8; --pk-line:#D9CDB8; --pk-edge:#2A2420;
  --pk-sky:#7EC8FF; --pk-grass:#A8D86A;
  --r-lg:20px; --r-md:16px; --r-sm:12px;
  --shadow:0 6px 0 rgba(42,36,32,.12), 0 10px 24px rgba(42,36,32,.10);
  --shadow-soft:0 3px 0 rgba(42,36,32,.08), 0 8px 18px rgba(42,36,32,.08);
  --font-display:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --nav-h:78px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--pk-ink); min-height:100dvh;
  background-color:var(--pk-bg3);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.55) 0 2px, transparent 3px),
    radial-gradient(circle at 78% 32%, rgba(255,255,255,.4) 0 1.5px, transparent 3px),
    radial-gradient(circle at 40% 72%, rgba(238,21,21,.08) 0 10px, transparent 11px),
    radial-gradient(circle at 85% 80%, rgba(255,203,5,.12) 0 14px, transparent 15px),
    linear-gradient(180deg, var(--pk-sky) 0%, #B8E4FF 28%, #E8F6C8 62%, var(--pk-grass) 100%);
  background-attachment:fixed;
}
button{font-family:inherit;border:none;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--pk-ink);}
img{max-width:100%;}

.app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--nav-h) + 12px);position:relative;}

/* ===== 头部 ===== */
header{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:6px;
  padding:11px 10px 12px;
  background:rgba(255,248,231,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:3px solid var(--pk-edge);
  box-shadow:inset 0 -3px 0 var(--pk-yellow), 0 6px 16px rgba(42,36,32,.08);
  min-width:0;
}
.logo{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.2px;flex:1 1 auto;min-width:0;color:var(--pk-ink);overflow:hidden;}
.logo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.logo img{flex:none;width:30px;height:30px;object-fit:contain;display:block;background:transparent;filter:drop-shadow(0 2px 0 rgba(42,36,32,.18));}
.logo svg{flex:none;width:26px;height:26px;}
.hd-right{display:flex;align-items:center;gap:4px;flex:0 0 auto;min-width:0;position:relative;z-index:1;}
.hd-right .chip{padding:5px 7px;font-size:11px;}
.hd-right .mode-btn{padding:6px 8px;font-size:11.5px;}
/* 孩子切换 */
.kid-switch{
  display:inline-flex;align-items:center;gap:3px;max-width:88px;flex:none;
  background:linear-gradient(180deg,#FFF9E0,#FFE9A0);border:2px solid var(--pk-edge);border-radius:99px;
  padding:4px 7px 4px 5px;font-size:12px;font-weight:900;color:#7A4E00;
  box-shadow:0 2px 0 rgba(42,36,32,.12);
}
.kid-switch .ks-av{font-size:16px;line-height:1;}
.kid-switch .ks-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:42px;}
.kid-switch .ks-ar{font-size:10px;opacity:.7;}
.kid-switch:active{transform:scale(.95);}
.kid-sheet-warn{background:#fff6e5;border:1px dashed #f0c060;border-radius:12px;padding:8px 10px;font-size:12px;color:#8a6d3b;font-weight:700;line-height:1.55;margin-top:10px;}
.kid-switch.solo{background:linear-gradient(135deg,#fff,#f4f4f4);border-color:var(--pk-line);color:#8a7a6a;}
.kid-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.kid-card{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--pk-paper);border:2.5px solid var(--pk-edge);border-radius:16px;padding:10px 12px;
  transition:transform .12s ease;box-shadow:0 2px 0 rgba(42,36,32,.08);
}
.kid-card:active{transform:scale(.98);}
.kid-card.on{border-color:var(--pk-edge);background:linear-gradient(180deg,#FFFDF1,#FFE9A8);box-shadow:0 3px 0 rgba(42,36,32,.12),0 0 0 3px var(--pk-yellow);}
.kid-card .kc-av{font-size:28px;line-height:1;flex:none;width:36px;text-align:center;}
.kid-card .kc-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.kid-card .kc-tx b{font-size:15.5px;font-weight:900;color:var(--pk-ink);}
.kid-card .kc-tx i{font-style:normal;font-size:11.5px;color:#8a7a6a;font-weight:700;}
.kid-card .kc-now{font-size:11.5px;font-weight:900;color:#8a5a00;background:#ffe9a8;border-radius:99px;padding:3px 9px;flex:none;}
.kid-card .kc-go{font-size:12px;font-weight:900;color:var(--pk-blue);flex:none;}
.av-wrap{display:flex;flex-wrap:wrap;gap:6px;}
.av-pick{width:42px;height:42px;font-size:22px;background:#fff;border:2px solid var(--pk-line);border-radius:13px;display:grid;place-items:center;}
.av-pick.on{border-color:var(--pk-yellow);background:linear-gradient(135deg,#fffdf1,#fff6d9);transform:scale(1.06);}
.kid-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border:2.5px solid var(--pk-edge);border-radius:14px;margin-bottom:7px;background:var(--pk-paper);box-shadow:0 2px 0 rgba(42,36,32,.08);}
.kid-row.on{border-color:var(--pk-edge);background:linear-gradient(180deg,#FFFDF1,#FFE9A8);box-shadow:0 2px 0 rgba(42,36,32,.1),0 0 0 2px rgba(255,203,5,.35);}
.kid-row .kr-av{font-size:24px;line-height:1;}
.kid-row .kr-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.kid-row .kr-tx b{font-size:14px;font-weight:900;}
.kid-row .kr-tx i{font-style:normal;font-size:11px;color:#8a7a6a;font-weight:700;}
.kid-row .kr-now{font-size:11px;font-weight:900;color:#8a5a00;background:#ffe9a8;border-radius:99px;padding:3px 8px;}
.kid-row .kr-btn{padding:6px 12px;min-height:0;font-size:12px;border-radius:99px;}
.kid-row .kr-del{background:none;color:#c9b8a8;font-size:14px;font-weight:900;padding:2px 4px;}
.chip{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--pk-paper);border:2px solid var(--pk-edge);border-radius:99px;
  padding:5px 9px;font-size:11.5px;font-weight:800;color:var(--pk-ink);white-space:nowrap;
  box-shadow:0 2px 0 rgba(42,36,32,.1);
}
.chip.hot{background:linear-gradient(180deg,#FFF7D6,#FFE08A);border-color:var(--pk-edge);color:#7A4E00;}
.mode-btn{
  display:inline-flex;align-items:center;gap:3px;
  background:linear-gradient(180deg,var(--pk-red-h),var(--pk-red));
  color:#fff;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800;
  border:2px solid var(--pk-edge);box-shadow:0 3px 0 rgba(42,36,32,.22);white-space:nowrap;
}
.mode-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(42,36,32,.22);}

/* ===== 主视图 ===== */
main{padding:14px 14px 8px;}
.view{animation:viewIn .28s ease;}
@keyframes viewIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.page-title{display:flex;align-items:baseline;gap:8px;margin:2px 2px 12px;}
.page-title h2{margin:0;font-family:var(--font-display);font-size:23px;font-weight:700;letter-spacing:.6px;color:var(--pk-ink);text-shadow:0 1px 0 rgba(255,255,255,.7);}
.page-title .sub{font-size:13px;color:var(--pk-ink-soft);font-weight:700;}

/* ===== 卡片 ===== */
.card{
  background:linear-gradient(180deg,var(--pk-paper-2),var(--pk-paper));
  border-radius:var(--r-lg);padding:16px;margin-bottom:14px;
  border:3px solid var(--pk-edge);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.85);
  position:relative;max-width:100%;min-width:0;
}
.card h3{
  margin:0 0 10px;font-family:var(--font-display);font-size:16.5px;font-weight:700;
  color:var(--pk-ink);letter-spacing:.3px;
  padding-bottom:8px;border-bottom:2px dashed var(--pk-line);
}
.section-label{
  font-size:13px;font-weight:800;color:var(--pk-ink-soft);margin:2px 0 10px;
  display:flex;align-items:center;gap:6px;font-family:var(--font-display);letter-spacing:.3px;
}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:99px;padding:12px 20px;font-size:15.5px;font-weight:800;
  min-height:46px;transition:transform .1s ease,box-shadow .1s ease;
  border:2.5px solid var(--pk-edge);
  box-shadow:0 4px 0 rgba(42,36,32,.2);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(42,36,32,.2);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 2px 0 rgba(42,36,32,.12);}
.btn-primary{background:linear-gradient(180deg,var(--pk-red-h),var(--pk-red));color:#fff;}
.btn-red{background:linear-gradient(180deg,#FF5A45,var(--pk-red-d));color:#fff;}
.btn-yellow{background:linear-gradient(180deg,var(--pk-yellow-s),var(--pk-yellow));color:#5D4300;}
.btn-green{background:linear-gradient(180deg,#6BCF74,var(--pk-green));color:#fff;}
.btn-blue{background:linear-gradient(180deg,#6BB0FF,var(--pk-blue));color:#fff;}
.btn-gray{background:linear-gradient(180deg,#F4EFE6,#E4DCCE);color:#5C4E44;}
.btn-block{display:flex;width:100%;}
.btn-sm{padding:8px 14px;font-size:13.5px;min-height:40px;border-radius:14px;border-width:2px;}
.btn-lg{padding:15px 22px;font-size:17px;}

/* ===== 输入 ===== */
.field{margin-bottom:12px;min-width:0;max-width:100%;}
.field label{display:block;font-size:13px;font-weight:800;color:var(--pk-ink-soft);margin-bottom:6px;}
.field input,.field textarea,.field select{
  display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;
  border:2.5px solid var(--pk-edge);border-radius:14px;
  padding:11px 13px;background:var(--pk-paper-2);outline:none;
  box-shadow:inset 0 2px 0 rgba(42,36,32,.04);
}
.field input[type="time"],.field input[type="number"],.field input[type="date"]{
  -webkit-appearance:none;appearance:none;max-width:100%;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--pk-yellow-d);box-shadow:0 0 0 3px rgba(255,203,5,.35);}
.inline-add{display:flex;gap:8px;align-items:center;width:100%;min-width:0;max-width:100%;}
.inline-add input{
  flex:1 1 auto;min-width:0;width:0;box-sizing:border-box;
  border:2.5px solid var(--pk-edge);border-radius:14px;padding:10px 12px;background:var(--pk-paper-2);outline:none;
}
.inline-add .btn{flex:0 0 auto;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.chip-opt{
  padding:9px 15px;border-radius:99px;background:var(--pk-paper);border:2.5px solid var(--pk-edge);
  font-size:14.5px;font-weight:800;color:var(--pk-ink);min-height:40px;
  box-shadow:0 2px 0 rgba(42,36,32,.12);
}
.chip-opt.on{background:linear-gradient(180deg,var(--pk-yellow-s),var(--pk-yellow));border-color:var(--pk-edge);color:#5D4300;}
.mon-pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:4px;}
.chip-opt.care-pick{
  display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:18px;min-height:48px;
  /* 属性色底由内联 background 注入；未注入时退回奶油纸色 */
  background:var(--pk-paper);
}
.chip-opt.care-pick.on{
  /* 选中用黄环提示，不覆盖属性色底 */
  box-shadow:0 2px 0 rgba(42,36,32,.12),0 0 0 3px var(--pk-yellow);
  color:var(--pk-ink);
}
.mon-pick-grid .chip-opt.care-pick{width:100%;justify-content:flex-start;margin:0;}
.chip-opt.care-pick img,.chip-opt.care-pick .care-pick-img{
  width:40px;height:40px;object-fit:contain;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff,#F3EAD8);border-radius:50%;
  border:2px solid var(--pk-edge);padding:2px;
}
.chip-opt.care-pick .care-pick-tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;gap:2px;min-width:0;}
.chip-opt.care-pick .care-pick-tx b{font-size:13.5px;font-weight:900;font-family:var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.chip-opt.care-pick .care-pick-tx i{font-style:normal;font-size:11px;font-weight:800;color:var(--pk-ink-soft);}
.chip-opt.care-pick.on .care-pick-tx i{color:var(--pk-ink-soft);}
.chip-opt.care-pick .care-pick-tag{font-size:14px;line-height:1;margin-left:auto;flex:none;}

/* ===== 宝可梦卡 ===== */
.mon-card{
  background:linear-gradient(180deg,var(--pk-paper-2),var(--pk-paper));
  border-radius:var(--r-lg);margin-bottom:14px;
  border:3px solid var(--pk-edge);box-shadow:var(--shadow);
  overflow:hidden;
}
.mon-head{display:flex;align-items:center;gap:14px;padding:16px;position:relative;overflow:hidden;}
.mon-ava{
  width:78px;height:78px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#fff,#F3EAD8);
  box-shadow:inset 0 -4px 10px rgba(0,0,0,.08),0 3px 0 rgba(42,36,32,.15);
  border:3px solid var(--pk-edge);overflow:hidden;
}
.mon-ava img{width:100%;height:100%;object-fit:contain;padding:5px;}
.mon-ava.small{width:56px;height:56px;font-size:30px;}
.mon-info{flex:1;min-width:0;}
.mon-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mon-name b{font-family:var(--font-display);font-size:19px;font-weight:700;}
.type-tag{font-size:11px;font-weight:900;color:#fff;border-radius:8px;padding:2px 8px;letter-spacing:1px;border:1.5px solid rgba(0,0,0,.18);text-shadow:0 1px 0 rgba(0,0,0,.2);}
.lv-tag{
  margin-left:auto;background:var(--pk-ink);color:var(--pk-yellow);font-weight:900;font-size:12.5px;
  border-radius:99px;padding:3px 11px;border:1.5px solid #000;font-family:var(--font-display);
}
.mon-sub{font-size:12.5px;color:var(--pk-ink-soft);margin-top:4px;font-weight:700;}
.xp-wrap{margin-top:10px;}
.xp-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--pk-ink-soft);font-weight:800;margin-bottom:4px;}
.xpbar{
  height:12px;background:#3B322C;border-radius:99px;overflow:hidden;
  border:2px solid var(--pk-edge);box-shadow:inset 0 2px 4px rgba(0,0,0,.35);
}
.xpfill{height:100%;background:linear-gradient(90deg,#FFE27A,#FFCB05 45%,#4CAF50);border-radius:99px;transition:width .6s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.45);}
.mon-moves{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 14px;background:var(--pk-soft);border-top:2px solid var(--pk-line);}
.move{
  font-size:12.5px;font-weight:800;background:var(--pk-paper);border:2px solid var(--pk-edge);
  border-radius:10px;padding:5px 10px;display:inline-flex;align-items:center;gap:5px;
  box-shadow:0 2px 0 rgba(42,36,32,.08);
}
.move .new{background:linear-gradient(180deg,var(--pk-yellow-s),var(--pk-yellow));color:#5D4300;border-radius:6px;padding:0 5px;font-size:10px;font-weight:900;border:1px solid var(--pk-edge);}

/* ===== 首页/目标卡 ===== */
.hero-card{
  background:
    linear-gradient(125deg, rgba(255,255,255,.22) 0 18%, transparent 19% 100%),
    linear-gradient(160deg, #FF6A45 0%, var(--pk-red) 48%, #B71C1C 100%);
  color:#fff;border-radius:var(--r-lg);padding:18px;margin-bottom:14px;position:relative;overflow:hidden;
  border:3px solid var(--pk-edge);
  box-shadow:0 6px 0 rgba(42,36,32,.2), 0 12px 28px rgba(238,21,21,.28);
}
.hero-card::after{
  content:"";position:absolute;right:-10px;bottom:-18px;width:120px;height:120px;
  background:url(icon-192.png) center/contain no-repeat;opacity:.22;pointer-events:none;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));
}
.hero-card h2{margin:0 0 4px;font-family:var(--font-display);font-size:22px;font-weight:700;position:relative;z-index:1;text-shadow:0 2px 0 rgba(0,0,0,.18);}
.hero-card .hi{font-size:13.5px;opacity:.95;font-weight:700;position:relative;z-index:1;}
.hero-card .stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;position:relative;z-index:1;}
.hero-stat{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:8px 12px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px);}
.hero-card .deco{display:none;}

/* ===== 作业条目 ===== */
.work-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px dashed var(--pk-line);}
.work-item:last-child{border-bottom:none;padding-bottom:2px;}
.work-ico{width:44px;height:44px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;background:var(--pk-soft);overflow:hidden;line-height:1;}
.work-body{flex:1;min-width:0;}
.work-body .t{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0;}
.work-body .work-subj{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.work-body .d{font-size:13px;color:#8a7a6a;margin-top:2px;word-break:break-word;overflow-wrap:anywhere;}
.work-time{font-size:11.5px;color:#b0a090;margin-top:3px;font-weight:600;}
.status{font-size:11px;font-weight:900;border-radius:8px;padding:3px 9px;flex:none;margin-top:4px;white-space:nowrap;}
.status.pending{background:#fff3d6;color:#a06800;}
.status.approved{background:#e2f5e3;color:#2e7d32;}
.status.deducted{background:#fde8e0;color:#c0392b;}
.status.rejected{background:#fdeaea;color:#c62828;}
.fast-tag{display:inline-block;font-size:10.5px;font-weight:900;background:linear-gradient(135deg,#ffe27a,var(--pk-yellow));color:#5d4300;border-radius:7px;padding:2px 7px;white-space:nowrap;}

/* ===== 道馆 ===== */
.gym-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:linear-gradient(180deg,var(--pk-paper-2),var(--pk-soft));margin-bottom:10px;border:2.5px solid var(--pk-edge);box-shadow:0 3px 0 rgba(42,36,32,.1);}
.gym-ico{width:52px;height:52px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:inset 0 -3px 6px rgba(0,0,0,.18);border:2px solid var(--pk-edge);}
.gym-info{flex:1;min-width:0;}
.gym-info b{font-size:15.5px;font-weight:900;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-family:var(--font-display);}
.gym-info .need{font-size:12px;color:#8a7a6a;font-weight:600;margin-top:2px;}
.badge-tag{font-size:11px;font-weight:900;background:linear-gradient(180deg,var(--pk-yellow-s),var(--pk-yellow));color:#5D4300;border-radius:8px;padding:2px 8px;border:1.5px solid var(--pk-edge);}
.badge-tag.got{background:linear-gradient(180deg,#E8F8E9,#C8E6C9);color:#1B5E20;border-color:#2E7D32;}

/* ===== 捕捉 ===== */
.aim-box{margin:16px 0;}
.aim{position:relative;height:40px;background:#ece4d8;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.12);}
.target{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#66bb6a,#43a047);opacity:.6;}
.marker{position:absolute;top:-3px;bottom:-3px;width:8px;border-radius:4px;background:var(--pk-red);box-shadow:0 0 6px rgba(227,53,13,.8);}
.aim-hint{display:flex;justify-content:space-between;font-size:12px;color:#8a7a6a;font-weight:700;margin-bottom:6px;}
.catch-stage{text-align:center;padding:10px 0 4px;}
.catch-stage .big{font-size:76px;animation:popIn .4s ease;}
@keyframes popIn{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}

/* ===== 钓鱼 ===== */
.fish-stage{position:relative;height:190px;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#cfeaff 0%,#a9dcf5 40%,#5eb2d8 70%,#2f86ae 100%);
  box-shadow:inset 0 -8px 18px rgba(0,40,70,.22);}
.fish-stage::before{content:'';position:absolute;left:0;right:0;bottom:34%;height:3px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
  animation:fishShine 3.6s ease-in-out infinite;}
@keyframes fishShine{0%,100%{opacity:.35;transform:translateX(-16%);}50%{opacity:.9;transform:translateX(16%);}}
.fish-far{position:absolute;left:0;right:0;bottom:0;height:30%;
  background:linear-gradient(180deg,rgba(30,110,150,0),rgba(20,80,120,.42));}
.fish-lily{position:absolute;font-size:22px;opacity:.9;animation:lilyBob 5.5s ease-in-out infinite;}
@keyframes lilyBob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-5px) rotate(4deg);}}
.fish-bob{position:absolute;font-size:40px;transition:top .45s cubic-bezier(.4,1.6,.5,1),transform .3s ease;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.28));}
.fish-bob.bite{animation:biteShake .3s ease-in-out 3;}
@keyframes biteShake{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(13px) rotate(6deg);}}
.fish-splash{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:46px;opacity:0;}
.fish-splash.go{animation:splashUp .75s ease-out both;}
@keyframes splashUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}35%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}100%{opacity:0;transform:translate(-50%,-90%) scale(1.35);}}
.fish-catch{text-align:center;padding:4px 0 0;}
.fish-catch img{width:132px;height:132px;object-fit:contain;animation:fishJump .55s cubic-bezier(.2,1.5,.4,1) both;}
@keyframes fishJump{0%{transform:translateY(26px) scale(.6);opacity:0;}100%{transform:translateY(0) scale(1);opacity:1;}}
.fish-tip{font-size:12.5px;font-weight:800;color:#0d5f7a;margin-top:6px;}

/* ===== 徽章墙 ===== */
.badge-wall{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.badge-cell{text-align:center;padding:10px 4px;border-radius:16px;background:var(--pk-paper);border:2.5px solid var(--pk-edge);box-shadow:0 2px 0 rgba(42,36,32,.08);}
.badge-cell .ic{font-size:30px;}
.badge-cell .nm{font-size:11px;font-weight:800;margin-top:4px;color:#8a7a6a;}
.badge-cell.got{background:linear-gradient(180deg,#FFF8E1,#FFE9A8);border-color:var(--pk-edge);box-shadow:0 2px 0 rgba(42,36,32,.1),0 0 0 2px rgba(255,203,5,.35);}
.badge-cell.got .nm{color:#7A5200;}

/* ===== 成就/统计 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-cell{background:linear-gradient(180deg,var(--pk-paper-2),var(--pk-paper));border-radius:16px;padding:12px;text-align:center;border:2.5px solid var(--pk-edge);box-shadow:0 3px 0 rgba(42,36,32,.1);}
.stat-cell b{display:block;font-size:24px;font-weight:900;line-height:1.2;font-family:var(--font-display);color:var(--pk-ink);}
.stat-cell span{font-size:12px;color:#8a7a6a;font-weight:700;}

/* ===== 底部导航 ===== */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:transparent;border:none;pointer-events:none;
}
.nav-inner{
  max-width:496px;margin:0 auto;display:flex;
  pointer-events:auto;
  background:rgba(255,248,231,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:3px solid var(--pk-edge);border-radius:24px;
  box-shadow:0 6px 0 rgba(42,36,32,.16), 0 -2px 0 var(--pk-yellow) inset, 0 12px 28px rgba(42,36,32,.14);
  overflow:hidden;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 0 9px;font-size:11px;font-weight:800;color:#8A7A6A;background:none;
  position:relative;
}
.tab .ti{font-size:21px;line-height:1.15;}
.tab.on{
  color:var(--pk-red);
  background:linear-gradient(180deg,rgba(255,203,5,.42),rgba(255,203,5,.12));
}
.tab.on::after{
  content:"";position:absolute;top:5px;width:6px;height:6px;border-radius:50%;
  background:var(--pk-red);border:1.5px solid var(--pk-edge);box-shadow:0 0 0 2px var(--pk-yellow);
}
.tab .dot{width:5px;height:5px;border-radius:50%;background:var(--pk-red);}

/* ===== 弹窗 ===== */
.mask{
  position:fixed;inset:0;z-index:100;background:rgba(20,14,10,.55);
  display:flex;align-items:center;justify-content:center;padding:22px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.dialog{
  background:linear-gradient(180deg,var(--pk-paper-2),var(--pk-paper));
  border-radius:24px;width:100%;max-width:420px;
  padding:22px 20px;
  border:3.5px solid var(--pk-edge);
  box-shadow:0 10px 0 rgba(42,36,32,.2), 0 22px 50px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.9);
  animation:dialogIn .28s cubic-bezier(.34,1.4,.64,1);max-height:88dvh;overflow:auto;
}
@keyframes dialogIn{from{opacity:0;transform:scale(.85) translateY(20px);}to{opacity:1;transform:none;}}
.dialog h3{margin:0 0 8px;font-family:var(--font-display);font-size:20px;font-weight:700;text-align:center;letter-spacing:.4px;}
.dialog .lead{text-align:center;font-size:13.5px;color:var(--pk-ink-soft);line-height:1.6;font-weight:600;}
.dialog .big-emoji{text-align:center;font-size:64px;margin:8px 0;animation:bounceIn .5s ease;}
@keyframes bounceIn{0%{transform:scale(0);}60%{transform:scale(1.2);}100%{transform:scale(1);}}
.dlg-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.dlg-actions.row{flex-direction:row;}
.dlg-actions.row .btn{flex:1;}

/* ===== Toast ===== */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw;}
.toast{
  background:var(--pk-ink);color:#fff;border-radius:99px;padding:9px 18px;
  font-size:13.5px;font-weight:800;border:2px solid #000;
  box-shadow:0 4px 0 rgba(0,0,0,.25), 0 0 0 3px var(--pk-yellow);
  animation:toastIn .25s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}

/* ===== 撒花 ===== */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden;}
.bit{position:absolute;top:-20px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.85;}}

/* ===== 初始选择页 ===== */
.starter-wrap{padding-top:18px;text-align:center;}
.starter-wrap h1{font-family:var(--font-display);font-size:28px;font-weight:700;margin:6px 0 4px;letter-spacing:.5px;}
.starter-wrap .hi{font-size:14px;color:var(--pk-ink-soft);margin-bottom:14px;line-height:1.6;font-weight:600;}
.starter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px;}
.starter-card{
  background:linear-gradient(180deg,var(--pk-paper-2),var(--pk-paper));
  border-radius:20px;padding:18px 10px 14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid var(--pk-edge);
  transition:transform .12s ease;cursor:pointer;min-height:150px;
}
.starter-card:active{transform:scale(.95);}
.starter-card .av{font-size:56px;line-height:1;width:74px;height:74px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;border:3px solid var(--pk-edge);overflow:hidden;box-shadow:0 3px 0 rgba(42,36,32,.12);}
.starter-card .av img{width:100%;height:100%;object-fit:contain;padding:4px;}
.starter-card b{font-family:var(--font-display);font-size:15px;font-weight:700;}
.starter-card .ty{font-size:11px;font-weight:800;color:#fff;border-radius:8px;padding:2px 9px;border:1.5px solid rgba(0,0,0,.15);}
.name-row{display:flex;gap:8px;align-items:center;margin-top:6px;}
.name-row input{flex:1;text-align:center;font-size:17px;font-weight:800;}

/* ===== 记录表 ===== */
table.rec{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px;}
table.rec th{font-size:11.5px;color:#8a7a6a;font-weight:800;padding:6px 4px;border-bottom:2px solid var(--pk-line);text-align:left;}
table.rec td{padding:8px 4px;border-bottom:1px dashed var(--pk-line);vertical-align:top;}
table.rec tr:last-child td{border-bottom:none;}

/* ===== 封印卡 ===== */
.seal-card{
  border-radius:var(--r-lg);padding:16px;margin-bottom:14px;text-align:center;
  background:linear-gradient(160deg,#3A2F28 0%,#2A2420 55%,#1A1512 100%);color:#fff;position:relative;overflow:hidden;
  border:3px solid var(--pk-edge);box-shadow:0 6px 0 rgba(42,36,32,.22), inset 0 0 0 3px rgba(255,203,5,.28);
}
.seal-card .ic{font-size:52px;animation:sealFloat 2.4s ease-in-out infinite;display:inline-block;}
.seal-card .ic img{width:64px;height:64px;object-fit:contain;}
@keyframes sealFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
.seal-card b{font-size:16px;font-weight:900;display:block;margin:6px 0 2px;font-family:var(--font-display);color:var(--pk-yellow);}
.seal-card .d{font-size:12.5px;opacity:.9;line-height:1.5;color:#F3EAD8;}
.seal-ring{display:inline-block;margin:10px auto 0;width:86px;height:86px;border-radius:50%;
  background:conic-gradient(#ffe27a 0deg, #ffcb05 var(--deg,0deg), rgba(255,255,255,.18) var(--deg,0deg) 360deg);
  display:flex;align-items:center;justify-content:center;border:2px solid var(--pk-edge);}
.seal-ring .inner{width:66px;height:66px;border-radius:50%;background:#1A1512;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:var(--pk-yellow);border:2px solid rgba(255,203,5,.35);}

/* ===== 战斗 ===== */
.battle-log{list-style:none;margin:0 0 14px;padding:0;text-align:center;}
.battle-log li{font-size:14px;font-weight:700;padding:7px 10px;border-radius:12px;background:var(--pk-soft);margin-bottom:7px;animation:logIn .25s ease;}
@keyframes logIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ===== 时间/空态 ===== */
.empty{text-align:center;padding:26px 10px;color:#9A8874;}
.empty .ic{font-size:46px;margin-bottom:8px;}
.empty .t{font-size:14.5px;font-weight:800;margin-bottom:3px;font-family:var(--font-display);color:var(--pk-ink-soft);}
.empty .s{font-size:12.5px;font-weight:600;}
.lock-note{
  background:linear-gradient(180deg,#FFF8E1,#FFE9A8);border:2.5px dashed var(--pk-edge);color:#7A4E00;border-radius:16px;
  padding:14px;font-size:13.5px;font-weight:800;text-align:center;margin-bottom:14px;line-height:1.6;
  box-shadow:0 3px 0 rgba(42,36,32,.08);
}

/* ===== 场景背景层（照顾 / 训练家过场共用，纯图片/CSS，无视频） ===== */
.scene-bg{position:absolute;inset:0;z-index:0;pointer-events:none;background-size:cover;background-position:center;}
/* 缓慢推拉，让静态场景有呼吸感 */
.care-stage .scene-bg,.tr-stage .scene-bg{transform-origin:50% 58%;animation:careCam 26s ease-in-out infinite alternate;}
@keyframes careCam{0%{transform:scale(1.02) translate(0,0);}100%{transform:scale(1.10) translate(-1.4%,-1.1%);}}
/* 中央柔光，模拟自然光的体积感 */
.scene-glow{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 26%,rgba(255,255,255,.42) 0%,rgba(255,255,255,.14) 32%,rgba(255,255,255,0) 62%);}
/* 场景装饰元素：云、树、星、花等，轻微上下漂浮 */
.scene-decor{position:absolute;inset:0;z-index:1;pointer-events:none;}
.scene-decor .sd{position:absolute;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12));opacity:.92;animation:sdFloat 6.5s ease-in-out infinite;}
@keyframes sdFloat{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-7px) rotate(2deg);}}
/* 前景：草地或水面，压在底部增加纵深 */
.scene-fg{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:1;pointer-events:none;}
.scene-fg.grass{background:linear-gradient(180deg,rgba(120,190,90,0) 0%,rgba(120,190,90,.30) 55%,rgba(86,160,66,.46) 100%);border-radius:50% 50% 0 0/22% 22% 0 0;transform:scaleX(1.3);}
.scene-fg.water{background:linear-gradient(180deg,rgba(140,210,255,0) 0%,rgba(140,210,255,.32) 45%,rgba(90,175,225,.50) 100%);}
.scene-fg.water::after{content:'';position:absolute;left:0;right:0;top:22%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:fgShine 4.5s ease-in-out infinite;}
@keyframes fgShine{0%,100%{opacity:.24;transform:translateX(-14%);}50%{opacity:.72;transform:translateX(14%);}}
/* 喂食暖光 / 洗澡水汽 */
.scene-soft{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 70%,rgba(255,214,140,.30) 0%,rgba(255,214,140,0) 58%);animation:softPulse 5s ease-in-out infinite;}
@keyframes softPulse{0%,100%{opacity:.55;}50%{opacity:.95;}}
/* 洗澡水汽：底部水面反光 + 几缕上升的白雾，不用横条纹（避免像网格） */
.scene-water{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.scene-water::before{content:'';position:absolute;left:-10%;right:-10%;bottom:0;height:42%;
  background:radial-gradient(ellipse at 50% 100%,rgba(150,215,255,.46) 0%,rgba(150,215,255,.20) 42%,rgba(150,215,255,0) 78%);}
.scene-water::after{content:'';position:absolute;left:0;right:0;bottom:8%;height:30px;
  background:radial-gradient(ellipse at 26% 100%,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 62%),
             radial-gradient(ellipse at 58% 100%,rgba(255,255,255,.42) 0%,rgba(255,255,255,0) 60%),
             radial-gradient(ellipse at 84% 100%,rgba(255,255,255,.50) 0%,rgba(255,255,255,0) 58%);
  animation:waterDrift 5.6s ease-in-out infinite;}
@keyframes waterDrift{0%,100%{opacity:.42;transform:translateX(-3%) scaleX(1);}50%{opacity:.86;transform:translateX(3%) scaleX(1.06);}}
/* 洗澡时整场景偏冷偏淡（水汽感），和喂食的暖调区分开 */
.care-stage.bath-mode .scene-bg{filter:saturate(.55) brightness(1.16) hue-rotate(-14deg);}
.care-stage.feed-mode .scene-bg{filter:saturate(1.16) brightness(.99) contrast(1.03);}
.vid-tint{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:soft-light;}
.vid-veil{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 68%,rgba(0,0,0,0) 34%,rgba(20,10,30,.34) 100%);}
.care-stage,.tr-stage{isolation:isolate;background-size:cover;background-position:center;}

/* ===== 照顾动画（图片场景 + 拟真光效层） ===== */
.care-stage{position:relative;height:300px;border-radius:20px;overflow:hidden;box-shadow:inset 0 -6px 14px rgba(0,0,0,.10);}
/* 氛围压暗：让前景宝可梦从场景里"跳出来" */
.care-shade{position:absolute;inset:0;z-index:1;pointer-events:none;}
.shade-food{background:radial-gradient(ellipse at 50% 62%,rgba(255,255,255,0) 26%,rgba(60,40,20,.20) 78%,rgba(40,25,10,.34) 100%);}
.shade-bath{background:radial-gradient(ellipse at 50% 55%,rgba(255,255,255,.12) 20%,rgba(20,50,80,.24) 82%,rgba(10,30,50,.38) 100%);}
.care-mon-wrap{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);width:132px;height:132px;z-index:2;}
.care-mon-wrap.in-tub{bottom:26px;z-index:3;}
.care-tub{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:214px;height:62px;z-index:2;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(140,200,255,.92));border-radius:26px 26px 28px 28px;box-shadow:inset 0 8px 12px rgba(255,255,255,.9),0 6px 14px rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.65);}
.care-tub::after{content:'';position:absolute;left:6px;right:6px;top:3px;height:14px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1px);}
.care-shadow{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);width:96px;height:20px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.34),rgba(0,0,0,0) 72%);filter:blur(2px);animation:careShadow 1.1s ease-in-out infinite;}
@keyframes careShadow{0%,100%{transform:translateX(-50%) scale(1);opacity:.75;}50%{transform:translateX(-50%) scale(.86);opacity:.5;}}
.care-mon{position:absolute;left:0;bottom:0;width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28)) saturate(1.06);animation:careBounce 1.1s ease-in-out infinite;transform-origin:50% 90%;}
@keyframes careBounce{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-9px) scale(1.035);}}
.care-mon.eat{animation:careEat .42s ease-in-out infinite;}
@keyframes careEat{0%,100%{transform:translateY(0) scale(1,1) rotate(0);}35%{transform:translateY(4px) scale(1.06,.92) rotate(-2deg);}70%{transform:translateY(-6px) scale(.96,1.06) rotate(2deg);}}
.care-mon.happy{animation:careHappy .55s ease-in-out infinite;}
@keyframes careHappy{0%,100%{transform:translateY(0) rotate(0) scale(1);}50%{transform:translateY(-14px) rotate(-6deg) scale(1.08);}}
.care-mon-bath{animation:careShake .7s ease-in-out infinite;}
.care-mon.scrub{animation:careScrub .38s ease-in-out infinite;}
@keyframes careScrub{0%,100%{transform:translateX(0) rotate(-3deg);}50%{transform:translateX(7px) rotate(4deg);}}
.care-mon.rinse{animation:careRinse .7s ease-in-out infinite;}
@keyframes careRinse{0%,100%{transform:translateY(0) scale(1);}40%{transform:translateY(-8px) scale(1.05);}70%{transform:translateY(3px) scale(.97);}}
.care-mon.sparkle{animation:careHappy .6s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28)) saturate(1.2) brightness(1.08);}
.care-splash{
  position:absolute;left:50%;bottom:48px;transform:translateX(-50%);z-index:4;pointer-events:none;
  font-size:28px;opacity:0;
}
.care-splash.go{animation:careSplashPop .7s ease-out forwards;}
@keyframes careSplashPop{0%{transform:translateX(-50%) scale(.4);opacity:0;}30%{opacity:1;transform:translateX(-50%) scale(1.15);}100%{transform:translateX(-50%) translateY(-36px) scale(1.3);opacity:0;}}
.care-steam{position:absolute;left:50%;bottom:70px;width:120px;height:80px;transform:translateX(-50%);z-index:3;pointer-events:none;}
.care-steam i{position:absolute;bottom:0;font-style:normal;font-size:18px;opacity:0;animation:steamUp 2.2s ease-out infinite;}
@keyframes steamUp{0%{transform:translateY(0) scale(.6);opacity:0;}20%{opacity:.7;}100%{transform:translateY(-70px) scale(1.2);opacity:0;}}
.care-chomp{position:absolute;z-index:5;font-size:22px;opacity:0;pointer-events:none;animation:chompPop .55s ease-out forwards;}
@keyframes chompPop{0%{transform:scale(.3);opacity:0;}40%{opacity:1;transform:scale(1.2);}100%{transform:translateY(-24px) scale(.9);opacity:0;}}
.care-sheen{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.3) 48%,rgba(255,255,255,0) 58%);background-size:280% 100%;animation:careSheen 3.4s ease-in-out infinite;}
@keyframes careSheen{0%{background-position:180% 0;}55%,100%{background-position:-80% 0;}}
.care-ground{position:absolute;left:0;right:0;bottom:0;height:54px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(59,47,47,.28));z-index:1;}
.care-bowl{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:40px;z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2));}
.care-tub-legacy{display:none;}
.foodbit{position:absolute;top:-30px;font-size:22px;z-index:3;animation:foodDrop 1.5s ease-in forwards;opacity:0;}
@keyframes foodDrop{0%{transform:translateY(0) rotate(0deg);opacity:0;}15%{opacity:1;}85%{opacity:1;}100%{transform:translateY(240px) rotate(220deg);opacity:0;}}
.bubble{position:absolute;bottom:26px;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.98),rgba(205,235,255,.75) 62%,rgba(150,200,255,.35) 100%);box-shadow:inset -3px -3px 6px rgba(120,180,255,.45),0 0 6px rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);z-index:3;animation:bubbleUp 2.6s ease-in infinite;opacity:0;}
.bubble.stick{bottom:auto;top:56%;animation:bubbleStick 2.2s ease-in-out infinite;}
@keyframes bubbleStick{0%,100%{transform:translateY(0) scale(.9);opacity:.85;}50%{transform:translateY(-16px) scale(1.12);opacity:.55;}}
.crumbs{position:absolute;bottom:56px;font-size:13px;color:#fff2c6;z-index:4;text-shadow:0 0 6px rgba(255,210,120,.9);animation:crumbPop 1.6s ease-out infinite;opacity:0;}
@keyframes crumbPop{0%{transform:translateY(0) scale(.4);opacity:0;}25%{opacity:1;}100%{transform:translateY(-42px) scale(1.2);opacity:0;}}
.water-rip{position:absolute;left:50%;bottom:24px;width:150px;height:26px;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(255,255,255,.55);z-index:2;animation:rip 2.4s ease-out infinite;}
@keyframes rip{0%{transform:translateX(-50%) scale(.5);opacity:0;}30%{opacity:.8;}100%{transform:translateX(-50%) scale(1.3);opacity:0;}}
@keyframes bubbleUp{0%{transform:translateY(0) scale(.7);opacity:0;}18%{opacity:.95;}100%{transform:translateY(-230px) scale(1.15);opacity:0;}}
.heartbit{position:absolute;bottom:150px;font-size:20px;z-index:3;animation:heartUp 1.9s ease-out forwards;opacity:0;}
@keyframes heartUp{0%{transform:translateY(0) scale(.6);opacity:0;}25%{opacity:1;}100%{transform:translateY(-100px) scale(1.25);opacity:0;}}
.sparklebit{position:absolute;font-size:18px;z-index:3;animation:sparkTw 1.25s ease-in-out infinite;}
@keyframes sparkTw{0%,100%{transform:scale(.5);opacity:.25;}50%{transform:scale(1.3);opacity:1;}}
.duckbit{position:absolute;bottom:52px;font-size:26px;z-index:4;animation:duckFloat 2.2s ease-in-out infinite;}
@keyframes duckFloat{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-8px) rotate(6deg);}}

/* 不同食物的下落方式 */
.fb-drop{animation:foodDrop 1.5s ease-in forwards;}
.fb-swing{animation:fbSwing 1.7s cubic-bezier(.4,0,.6,1) forwards;}
.fb-spin{animation:fbSpin 1.7s linear forwards;}
.fb-flip{animation:fbFlip 1.7s ease-in forwards;}
.fb-slide{animation:fbSlide 1.5s ease-in forwards;}
.fb-pour{animation:fbPour 2s ease-in forwards;}
@keyframes fbSwing{0%{transform:translate(0,-10px) rotate(-35deg);opacity:0;}15%{opacity:1;}100%{transform:translate(0,250px) rotate(65deg);opacity:0;}}
@keyframes fbSpin{0%{transform:translateY(0) rotate(0deg);opacity:0;}15%{opacity:1;}100%{transform:translateY(255px) rotate(540deg);opacity:0;}}
@keyframes fbFlip{0%{transform:translateY(-18px) rotateX(0deg) scale(1);opacity:0;}20%{opacity:1;}60%{transform:translateY(140px) rotateX(360deg) scale(1.08);}100%{transform:translateY(248px) rotateX(720deg) scale(.9);opacity:0;}}
@keyframes fbSlide{0%{transform:translate(0,-20px) rotate(-45deg);opacity:0;}25%{opacity:1;}100%{transform:translate(0,235px) rotate(85deg);opacity:0;}}
@keyframes fbPour{0%{transform:translateY(0) scaleY(.4);opacity:0;}20%{opacity:.95;}100%{transform:translateY(232px) scaleY(1.5);opacity:0;}}

.care-badge{position:absolute;top:10px;left:12px;font-size:13px;font-weight:900;padding:4px 10px;border-radius:99px;z-index:5;}
.care-dish{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:30px;z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2));}
.care-mon-bath{animation:careShake .7s ease-in-out infinite;}
@keyframes careShake{0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2deg);}}
.care-stage.phase-eat .care-bowl{animation:bowlBounce .5s ease-in-out infinite;}
@keyframes bowlBounce{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.08) translateY(2px);}}
.care-stage.phase-scrub .care-tub{filter:brightness(1.08);}
.care-stage.phase-rinse .water-rip{animation-duration:1.2s;}
.favbit{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:rgba(255,203,5,.94);color:#5d4300;font-size:12.5px;font-weight:900;padding:4px 10px;border-radius:99px;z-index:5;animation:favPop .5s ease-out;}
@keyframes favPop{from{transform:translateX(-50%) scale(.5);opacity:0;}to{transform:translateX(-50%) scale(1);opacity:1;}}
.petalbit{position:absolute;top:-24px;z-index:3;animation:petalFall 3s linear infinite;}
@keyframes petalFall{0%{transform:translateY(0) rotate(0deg);opacity:0;}12%{opacity:1;}100%{transform:translateY(285px) translateX(28px) rotate(320deg);opacity:0;}}
.foambit{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f4ecdf);box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:3;animation:foamFloat 2s ease-in-out infinite;}
@keyframes foamFloat{0%,100%{transform:translateY(0) scale(.9);}50%{transform:translateY(-6px) scale(1.12);}}

/* 照顾页选项 */
.care-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.care-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--pk-paper);border:2.5px solid var(--pk-edge);border-radius:16px;padding:9px 4px 7px;transition:transform .12s ease,box-shadow .12s ease;box-shadow:0 2px 0 rgba(42,36,32,.1);}
.care-item:active{transform:scale(.94);}
.care-item .ci{font-size:26px;line-height:1.15;}
.care-item .cn{font-size:11.5px;font-weight:800;color:#6b5a4a;}
.care-item.fav{border-color:var(--pk-yellow);background:linear-gradient(180deg,#fffdf0,#fff8dc);box-shadow:0 2px 8px rgba(255,203,5,.35);}
.care-note{margin-top:8px;font-size:11.5px;color:#8a6d3b;font-weight:700;text-align:center;}

/* ===== 队内对战动画 ===== */
.arena{position:relative;height:296px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#bfe3ff 0%,#dff0ff 44%,#d9f0b6 44%,#bfe08c 100%);box-shadow:inset 0 -6px 14px rgba(0,0,0,.1);}
.arena-side{position:absolute;bottom:54px;width:44%;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:2;}
.arena-side.left{left:3%;}
.arena-side.right{right:3%;}
.fighter{width:102px;height:102px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18));}
.fighter.hit{animation:hitShake .32s ease;}
@keyframes hitShake{0%,100%{transform:translateX(0);filter:brightness(1);}25%{transform:translateX(-7px);filter:brightness(1.85) saturate(.35);}75%{transform:translateX(7px);}}
.fighter.lunge-r{animation:lungeR .36s ease;}
@keyframes lungeR{0%,100%{transform:translateX(0);}50%{transform:translateX(46px) translateY(-9px) scale(1.06);}}
.fighter.lunge-l{animation:lungeL .36s ease;}
@keyframes lungeL{0%,100%{transform:translateX(0);}50%{transform:translateX(-46px) translateY(-9px) scale(1.06);}}
.fighter.faint{animation:faintOut .8s ease forwards;}
@keyframes faintOut{to{opacity:.12;transform:translateY(16px) rotate(-14deg);}}
.hp-wrap{width:100%;}
.hp-name{font-size:11.5px;font-weight:900;text-align:center;color:#3b2f2f;text-shadow:0 1px 0 #fff;margin-bottom:3px;}
.hp-name span{font-size:10px;color:#7a6a5a;font-weight:800;}
.hpbar2{height:8px;background:rgba(255,255,255,.85);border:1px solid rgba(59,47,47,.18);border-radius:99px;overflow:hidden;}
.hpfill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#66bb6a,#43a047);transition:width .45s ease;}
.dmg-layer{position:absolute;top:34%;width:44%;height:0;z-index:4;pointer-events:none;}
#arenaNumA{left:3%;}
#arenaNumB{right:3%;}
.dmg-float{position:absolute;left:50%;top:0;font-size:19px;font-weight:900;color:#e53935;text-shadow:0 2px 0 #fff,0 0 6px rgba(255,255,255,.85);animation:dmgUp 1s ease-out forwards;white-space:nowrap;}
.dmg-float.crit{color:#ff6d00;font-size:23px;}
.dmg-float.heal{color:#2e7d32;}
@keyframes dmgUp{0%{opacity:0;transform:translate(-50%,10px) scale(.7);}25%{opacity:1;}100%{opacity:0;transform:translate(-50%,-48px) scale(1.15);}}
.vs-badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,var(--pk-red-h),var(--pk-red));color:#fff;font-weight:900;font-size:15px;padding:4px 16px;border-radius:99px;z-index:5;letter-spacing:1px;border:2px solid var(--pk-edge);box-shadow:0 3px 0 rgba(42,36,32,.25);}
.arena-msg{position:absolute;left:10px;right:10px;bottom:8px;background:var(--pk-paper);border:2px solid var(--pk-edge);border-radius:12px;padding:7px 10px;font-size:12px;font-weight:800;color:var(--pk-ink);text-align:center;z-index:5;box-shadow:0 2px 0 rgba(42,36,32,.12);min-height:32px;display:flex;align-items:center;justify-content:center;}

/* ===== 每日遇见 · 大木博士 ===== */
.meet-banner{
  width:100%;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#F3F9FF,#E7F2FF);
  border:3px solid var(--pk-edge);border-radius:18px;padding:10px 12px;margin:10px 0 2px;
  text-align:left;
  box-shadow:0 4px 0 rgba(42,36,32,.12), inset 0 0 0 3px rgba(255,203,5,.35);
}
.meet-banner:active{transform:scale(.99);}
.mb-ic{font-size:27px;line-height:1;}
.mb-text{flex:1;display:flex;flex-direction:column;gap:1px;}
.mb-text b{font-size:14px;font-weight:900;color:#1E3A6E;font-family:var(--font-display);}
.mb-text i{font-style:normal;font-size:11.5px;color:#5A6F90;font-weight:700;}
.mb-go{font-size:12px;font-weight:900;color:#5D4300;background:linear-gradient(180deg,var(--pk-yellow-s),var(--pk-yellow));border:2px solid var(--pk-edge);border-radius:99px;padding:5px 11px;box-shadow:0 2px 0 rgba(42,36,32,.15);white-space:nowrap;}
.meet-dialog{padding:14px 14px 16px;max-height:90dvh;overflow-y:auto;}
.meet-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:900;color:var(--pk-ink);margin-bottom:8px;font-family:var(--font-display);}
.meet-top span{font-size:11.5px;color:var(--pk-ink-soft);font-weight:800;}
.meet-topic{display:inline-block;font-size:11px;font-weight:900;color:#7A4F00;background:linear-gradient(180deg,#FFF8E1,#FFE9A8);border:2px solid var(--pk-edge);border-radius:99px;padding:3px 12px;margin:-2px 0 8px;}
.lab{position:relative;height:220px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#dfe9f7 0%,#eef4fc 52%,#d5e1f0 100%);}
.lab:after{content:'';position:absolute;left:0;right:0;bottom:0;height:50px;background:linear-gradient(180deg,#cfdcee,#c1d1e7);}
.lab-sign{position:absolute;top:8px;left:10px;font-size:9.5px;font-weight:900;letter-spacing:.5px;color:#6b7a95;background:rgba(255,255,255,.8);padding:3px 8px;border-radius:8px;z-index:6;}
.lab-ball{position:absolute;top:14px;width:12px;height:12px;border-radius:50%;background:linear-gradient(180deg,#e3350d 0 48%,#fff 48% 100%);border:1.5px solid #3b2f2f;z-index:6;}
.speech{position:absolute;left:12px;right:12px;top:36px;background:var(--pk-paper);border:2.5px solid var(--pk-edge);border-radius:14px;padding:9px 12px;box-shadow:0 4px 0 rgba(42,36,32,.12);z-index:5;min-height:64px;display:flex;flex-direction:column;justify-content:center;}
.speech .en{font-size:16.5px;font-weight:900;color:var(--pk-ink);line-height:1.35;font-family:var(--font-display);}
.speech .zh{font-size:12px;color:var(--pk-ink-soft);font-weight:700;margin-top:3px;}
.meet-char{position:absolute;bottom:30px;width:88px;height:88px;border-radius:50%;z-index:3;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#ffffff,#eaf1fb);box-shadow:0 6px 14px rgba(40,60,90,.16);border:2px solid #fff;transition:transform .22s ease,opacity .22s ease,box-shadow .22s ease;}
.meet-char.oak{left:10px;}
.meet-char.kid{right:10px;font-size:46px;}
.meet-char.speaking{transform:scale(1.07);box-shadow:0 0 0 3px rgba(255,203,5,.9),0 8px 18px rgba(0,0,0,.18);opacity:1;}
.meet-char.idle{opacity:.55;transform:scale(.9);}
.meet-char .nm{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:#4a5a72;white-space:nowrap;background:rgba(255,255,255,.75);padding:1px 6px;border-radius:6px;}
.meet-dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:10px 0 6px;}
.mdot{width:7px;height:7px;border-radius:50%;background:#dbe3ef;}
.mdot.on{background:#1e88e5;transform:scale(1.25);}
.mdot.done{background:#90caf9;}
.meet-finish{width:100%;text-align:center;padding:2px 0 4px;}
.meet-finish b{font-size:14.5px;color:var(--pk-ink);font-weight:900;font-family:var(--font-display);}
.finish-sub{font-size:11.5px;color:var(--pk-ink-soft);font-weight:700;margin-top:2px;}
.mw-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:6px;}
.mw{display:flex;align-items:center;gap:6px;background:var(--pk-paper);border:2px solid var(--pk-edge);border-radius:12px;padding:7px 9px;text-align:left;box-shadow:0 2px 0 rgba(42,36,32,.08);}
.mw:active{transform:scale(.97);}
.mw span:first-child{display:flex;flex-direction:column;}
.mw b{font-size:12px;font-weight:900;color:var(--pk-ink);}
.mw i{font-style:normal;font-size:10.5px;color:var(--pk-ink-soft);font-weight:600;}
.mw .sp{margin-left:auto;font-size:13px;}

/* ===== 训练家 ===== */
.mon-tap{cursor:pointer;transition:transform .12s ease;}
.mon-tap:active{transform:scale(.985);}
.skill-tag{font-size:10px;font-weight:900;color:#5D4300;background:linear-gradient(180deg,var(--pk-yellow-s),var(--pk-yellow));border:1.5px solid var(--pk-edge);border-radius:99px;padding:2px 8px;margin-left:auto;}
.mon-detail .md-sec{margin-top:12px;text-align:left;}
.mon-detail .md-sec h4{margin:0 0 6px;font-size:12.5px;font-weight:900;color:#8a7a6a;letter-spacing:.4px;}
.mon-detail .md-moves{display:flex;flex-wrap:wrap;gap:6px;}
.mon-detail .md-move{
  font-size:12.5px;font-weight:700;background:var(--pk-paper);border:2px solid var(--pk-edge);

  box-shadow:0 2px 0 rgba(42,36,32,.08);
}

.mon-detail .md-note{font-size:12.5px;color:#6b5a4a;font-weight:600;line-height:1.55;margin:0;}
.nav-inner.many .tab{font-size:10px;padding:8px 0 7px;}
.nav-inner.many .tab .ti{font-size:19px;}
.tr-svg{width:96px;height:auto;max-width:100%;max-height:100%;display:block;overflow:hidden;pointer-events:none;}

  width:100%;height:100%;object-fit:contain;object-position:center bottom;
  background:transparent;border:0;padding:0;
}
.trsp{animation:trTwinkle 2.6s ease-in-out infinite;}
@keyframes trTwinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.tr-svg.mini{width:46px;height:auto;}
img.tr-svg.mini{width:100%;height:100%;}
.tr-banner{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#EEF6FF,#DCEEFF);
  border:3px solid var(--pk-edge);border-radius:18px;padding:10px 12px;margin:0 0 12px;cursor:pointer;
  box-shadow:0 4px 0 rgba(42,36,32,.12), inset 0 0 0 3px rgba(43,125,233,.18);
}
.tb-ava{width:54px;height:66px;border-radius:14px;background:var(--pk-paper);border:2px solid var(--pk-edge);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none;padding:2px 2px 0;}
.tb-ava .tr-svg{width:100%;height:100%;}
.tb-info{flex:1;min-width:0;}
.tb-info b{font-size:13.5px;font-weight:900;color:#1E4F9A;font-family:var(--font-display);}
.tb-sub{font-size:11px;color:#4A6FA5;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-go{font-size:11.5px;font-weight:900;color:#fff;background:linear-gradient(180deg,#6BB0FF,var(--pk-blue));border:2px solid var(--pk-edge);padding:6px 10px;border-radius:99px;flex:none;box-shadow:0 2px 0 rgba(42,36,32,.18);}
.tr-hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:14px;background:linear-gradient(145deg,#1A4F9C,#2B7DE9 55%,#FFCB05);box-shadow:var(--shadow);border:3px solid var(--pk-edge);}
.tr-hero-bg{position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.32),transparent 46%),radial-gradient(circle at 12% 92%,rgba(255,203,5,.4),transparent 52%);}
.tr-hero-in{position:relative;display:flex;align-items:center;gap:12px;padding:14px;}
.tr-hero-ava{width:112px;height:132px;border-radius:18px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.45);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none;padding:4px 4px 0;box-sizing:border-box;}
.tr-hero-ava .tr-svg{width:100%;height:100%;}
.tr-name{color:#fff;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-display);text-shadow:0 2px 0 rgba(0,0,0,.2);}
.tr-title{font-size:10.5px;background:var(--pk-yellow);color:#5D4300;border-radius:8px;padding:2px 8px;font-weight:900;border:1.5px solid var(--pk-edge);}
.tr-meta{color:#EAF3FF;font-size:11.5px;font-weight:700;margin-top:5px;line-height:1.5;}
.tr-gender{display:flex;gap:6px;margin-top:8px;}
.gbtn{font-size:11px;font-weight:800;color:#EAF3FF;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.5);border-radius:99px;padding:4px 10px;}
.gbtn.on{background:var(--pk-yellow);color:#5D4300;border-color:var(--pk-edge);}
.tr-task{font-size:14px;font-weight:800;color:#5D4300;background:linear-gradient(180deg,#FFF8E1,#FFE9A8);border:2.5px dashed var(--pk-edge);border-radius:14px;padding:10px 12px;margin:6px 0 10px;line-height:1.45;}
.tr-dots{display:flex;gap:6px;}
.tr-dot{flex:1;height:34px;border-radius:10px;background:var(--pk-soft);color:#b0a090;font-size:12.5px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px dashed var(--pk-line);}
.tr-dot.on{background:linear-gradient(180deg,#6BCF74,var(--pk-green));color:#fff;border:2px solid var(--pk-edge);}
.tr-prog{text-align:center;font-size:12.5px;font-weight:800;color:#8a6d3b;margin:9px 0 10px;}
.tr-note{font-size:11.5px;color:#8a6d3b;font-weight:700;margin:9px 0 0;text-align:center;line-height:1.5;}
.of-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.of-card{background:linear-gradient(180deg,var(--pk-paper-2),var(--pk-paper));border-radius:16px;padding:9px 8px 10px;border:2.5px solid var(--pk-edge);text-align:center;box-shadow:0 3px 0 rgba(42,36,32,.1);}
.of-pp{height:96px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,#EEF6FF,#DCEEFF);border-radius:12px;margin-bottom:6px;overflow:hidden;border:2px solid var(--pk-line);padding:4px 4px 0;box-sizing:border-box;}
.of-pp .tr-svg{width:100%;height:100%;}
.of-card b{display:block;font-size:11.5px;font-weight:900;color:#5a4a3a;line-height:1.35;}
.of-card span{font-size:10.5px;font-weight:800;color:#a09080;}
.of-card.on{border-color:var(--pk-edge);box-shadow:0 4px 0 rgba(42,36,32,.14),0 0 0 3px rgba(43,125,233,.35);}
.of-card.on span{color:var(--pk-blue);}
.of-card.lock{opacity:.55;}
.of-card.lock .of-pp{filter:grayscale(1);}
.tr-setnow{font-size:12.5px;font-weight:800;color:#5D4300;background:linear-gradient(180deg,#FFF8E1,#FFE9A8);border:2px solid var(--pk-edge);border-radius:12px;padding:8px 10px;margin-bottom:8px;line-height:1.5;}
.tr-picker{display:flex;gap:12px;margin:10px 0 6px;}
.tr-pick{flex:1;background:var(--pk-paper);border:2.5px solid var(--pk-edge);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 rgba(42,36,32,.1);}
.tr-pick.on{border-color:var(--pk-edge);background:linear-gradient(180deg,#EEF6FF,#DCEEFF);box-shadow:0 3px 0 rgba(42,36,32,.12),0 0 0 3px rgba(43,125,233,.3);}
.tr-pick .pp{height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;padding:0 4px;}

.tr-pick span{font-size:17px;}
.tr-unlock-card{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#FFF8E1,#FFE9A8);border:2.5px solid var(--pk-edge);border-radius:16px;padding:10px 12px;margin:10px 0;box-shadow:0 3px 0 rgba(42,36,32,.1);}
.tr-unlock-card .tr-svg{width:64px;height:80px;}
.tr-unlock-card b{display:block;font-size:14px;font-weight:900;color:#5D4300;font-family:var(--font-display);}
.tr-unlock-card .uu{font-size:11.5px;font-weight:800;color:#8A6D3B;margin-top:3px;}
/* 过场舞台 */
.tr-stage{position:relative;height:252px;border-radius:18px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;}
.tr-tag,.tr-wear{position:absolute;top:10px;font-size:11.5px;font-weight:900;padding:4px 10px;border-radius:99px;z-index:6;}
.tr-tag{left:12px;}
.tr-wear{right:12px;font-size:10.5px;}
.tr-sky{position:absolute;inset:0;}
.tr-prop{position:absolute;bottom:40px;font-size:23px;animation:trFloat 3.4s ease-in-out infinite;opacity:.92;}
@keyframes trFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.tr-ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.14));}
.tr-actor{position:relative;z-index:4;margin-bottom:4px;transform-origin:50% 92%;width:120px;height:150px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
.tr-actor .tr-svg{width:100%;height:100%;}
.tr-actor.act-run{animation:trRun 1s ease-in-out infinite;}
@keyframes trRun{0%,100%{transform:translateX(-14px) rotate(-2.5deg)}50%{transform:translateX(14px) rotate(2.5deg)}}
.tr-actor.act-throw{animation:trThrow 1.2s ease-in-out infinite;}
@keyframes trThrow{0%{transform:rotate(0)}35%{transform:rotate(-9deg) translateX(-4px)}55%{transform:rotate(12deg) translateX(4px)}100%{transform:rotate(0)}}
.tr-actor.act-highfive{animation:trHigh 1.1s ease-in-out infinite;}
@keyframes trHigh{0%,100%{transform:translateY(0)}45%{transform:translateY(-9px) rotate(-3deg)}}
.tr-actor.act-jump{animation:trJump 1.3s ease-in-out infinite;}
@keyframes trJump{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-30px) scale(1.03)}50%{transform:translateY(-30px) scale(1.03)}70%{transform:translateY(0) scale(.98)}}
.tr-actor.act-polish{animation:trPolish 1.4s ease-in-out infinite;}
@keyframes trPolish{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg) scale(1.02)}}
.tr-actor.act-cheer{animation:trCheer .8s ease-in-out infinite;}
@keyframes trCheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tr-actor.act-star{animation:trStar 2.4s ease-in-out infinite;}
@keyframes trStar{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.02)}}
.tr-fx{position:absolute;inset:0;pointer-events:none;z-index:5;}
.tr-fxbit{position:absolute;font-size:20px;animation:trBit 1.8s ease-in-out infinite;}
@keyframes trBit{0%,100%{transform:translateY(0) scale(1);opacity:.9}50%{transform:translateY(-14px) scale(1.15);opacity:1}}
.tr-ball{position:absolute;left:32%;top:40%;animation:trBall 1.6s ease-in-out infinite;line-height:0;}
.ball-ico{display:inline-block;vertical-align:-0.22em;flex-shrink:0;overflow:visible;filter:drop-shadow(0 1px 0 rgba(0,0,0,.2));}
.ball-ico.lg{vertical-align:-0.32em;}
.btn .ball-ico{margin-right:5px;}
.ball-pair{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.ball-pair + .ball-pair{margin-left:8px;}
@keyframes trBall{0%{transform:translate(0,0) rotate(0)}45%{transform:translate(120px,-70px) rotate(300deg)}80%{transform:translate(210px,20px) rotate(620deg);opacity:.9}100%{transform:translate(210px,20px) rotate(620deg);opacity:0}}
.tr-pal{position:absolute;right:8%;bottom:8px;width:78px;height:78px;object-fit:contain;animation:trPal 1.2s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));}
@keyframes trPal{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tr-meteor{position:absolute;left:8%;top:12%;font-size:22px;animation:trMeteor 2.6s ease-in-out infinite;}
@keyframes trMeteor{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(190px,90px);opacity:0}}

/* ===== 训练家过场 · 魔法层 ===== */
.tr-stage{height:262px;}
.tr-magic{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;}
.mg-spark{position:absolute;color:#fff;text-shadow:0 0 8px rgba(255,240,180,.95),0 0 18px rgba(255,200,120,.7);animation-name:mgTwinkle;animation-iteration-count:infinite;animation-timing-function:ease-in-out;}
@keyframes mgTwinkle{0%,100%{opacity:0;transform:scale(.35) rotate(0deg);}45%{opacity:1;transform:scale(1.25) rotate(90deg);}70%{opacity:.55;transform:scale(.85) rotate(140deg);}}
.mg-mote{position:absolute;bottom:-8%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,236,180,.85) 55%,rgba(255,210,120,0) 75%);animation-name:mgRise;animation-iteration-count:infinite;animation-timing-function:linear;opacity:0;}
@keyframes mgRise{0%{transform:translateY(0) scale(.4);opacity:0;}12%{opacity:.95;}80%{opacity:.6;}100%{transform:translateY(-285px) scale(1.25);opacity:0;}}
.mg-ring{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(255,255,255,.55);box-shadow:0 0 22px rgba(255,240,190,.8),inset 0 0 18px rgba(255,240,190,.55);}
.mg-ring.r1{width:210px;height:52px;animation:mgRing 3.6s ease-in-out infinite;}
.mg-ring.r2{width:150px;height:38px;animation:mgRing 3.6s ease-in-out infinite;animation-delay:-1.8s;border-color:rgba(255,255,255,.35);}
@keyframes mgRing{0%,100%{opacity:.35;transform:translateX(-50%) scale(.88);}50%{opacity:.95;transform:translateX(-50%) scale(1.12);}}
.mg-aura{position:absolute;left:50%;bottom:-30px;width:280px;height:230px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 82%,rgba(255,244,200,.62) 0%,rgba(255,210,120,.26) 34%,rgba(255,180,220,.12) 58%,rgba(0,0,0,0) 76%);animation:mgAura 3.2s ease-in-out infinite;}
@keyframes mgAura{0%,100%{opacity:.7;transform:translateX(-50%) scale(.96);}50%{opacity:1;transform:translateX(-50%) scale(1.06);}}
.mg-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,rgba(255,255,255,.85),rgba(255,255,255,0) 58%);opacity:0;animation:mgFlash 3.6s ease-out infinite;}
@keyframes mgFlash{0%{opacity:0;}6%{opacity:.85;}22%{opacity:0;}100%{opacity:0;}}
.tr-platform{position:absolute;left:50%;bottom:2px;width:150px;height:20px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(255,250,220,.9),rgba(255,220,150,.4) 55%,rgba(0,0,0,0) 78%);z-index:3;filter:blur(1px);}
.tr-glow{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.5;mix-blend-mode:screen;}
.tr-sheen{position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,0) 36%,rgba(255,255,255,.42) 47%,rgba(255,255,255,0) 58%);background-size:260% 100%;animation:trSheen 4.2s ease-in-out infinite;}
@keyframes trSheen{0%{background-position:170% 0;}60%,100%{background-position:-70% 0;}}
.tr-stage .tr-actor{z-index:4;}
/* 技能舞台 */
.sk-mask{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:skFade .18s ease-out;background:rgba(10,12,18,.92);}
@keyframes skFade{from{opacity:0}to{opacity:1}}
.sk-aura{position:absolute;inset:0;}
.sk-rays{position:absolute;left:50%;top:44%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,currentColor 0deg 5deg,transparent 5deg 17deg);opacity:.10;animation:skSpin 10s linear infinite;}
@keyframes skSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.sk-parts{position:absolute;inset:0;pointer-events:none;}
.sk-p{position:absolute;animation-duration:1.8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;}
.sk-rise{animation-name:skRise;}
@keyframes skRise{0%{transform:translateY(20px) scale(.7);opacity:0}30%{opacity:1}100%{transform:translateY(-90px) scale(1.15);opacity:0}}
.sk-fall{animation-name:skFall;}
@keyframes skFall{0%{transform:translateY(-40px) scale(.8);opacity:0}30%{opacity:1}100%{transform:translateY(70px) scale(1.1);opacity:0}}
.sk-burst{animation-name:skBurst;}
@keyframes skBurst{0%{transform:scale(.3) rotate(0);opacity:0}35%{opacity:1}100%{transform:scale(1.5) rotate(140deg);opacity:0}}
.sk-swirl{animation-name:skSwirl;}
@keyframes skSwirl{0%{transform:translate(0,0) rotate(0) scale(.7);opacity:0}35%{opacity:1}100%{transform:translate(28px,-40px) rotate(280deg) scale(1.1);opacity:0}}
.sk-drop{animation-name:skDrop;}
@keyframes skDrop{0%{transform:translateY(-70px) rotate(-40deg);opacity:0}40%{opacity:1}100%{transform:translateY(60px) rotate(30deg);opacity:0}}
.sk-mon-wrap{position:relative;z-index:5;animation:skIn .55s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes skIn{0%{transform:scale(.4) translateY(40px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.sk-mon{width:min(58vw,235px);height:auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,.55));}
.sk-mon-wrap.hit{animation:skAttack .55s ease-out both;}
.sk-mon-wrap.dash{animation:skDash .62s ease-out both;}
.sk-mon-wrap.cast{animation:skCast .7s ease-out both;}
.sk-mon-wrap.quake{animation:skQuake .6s ease-out both;}
.sk-mon-wrap.float{animation:skFloatPose .85s ease-in-out both;}
.sk-mon-wrap.zap{animation:skZap .55s ease-out both;}
@keyframes skAttack{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-18px) scale(1.16) rotate(-3deg)}100%{transform:translateY(4px) scale(1.03)}}
@keyframes skDash{0%{transform:translate(0,0) scale(1)}35%{transform:translate(42px,-10px) scale(1.12) rotate(6deg)}55%{transform:translate(-18px,6px) scale(.96) rotate(-4deg)}100%{transform:translate(0,0) scale(1)}}
@keyframes skCast{0%{transform:scale(1) translateY(0)}25%{transform:scale(.92) translateY(8px)}55%{transform:scale(1.18) translateY(-22px)}100%{transform:scale(1.04) translateY(0)}}
@keyframes skQuake{0%,100%{transform:translate(0,0)}20%{transform:translate(-10px,4px) rotate(-2deg)}40%{transform:translate(12px,-2px) rotate(2deg)}60%{transform:translate(-8px,3px)}80%{transform:translate(6px,0)}}
@keyframes skFloatPose{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-28px) scale(1.08)}100%{transform:translateY(-8px) scale(1.02)}}
@keyframes skZap{0%,100%{transform:translate(0,0) skewX(0)}15%{transform:translate(8px,-4px) skewX(-4deg)}30%{transform:translate(-10px,2px) skewX(5deg)}50%{transform:translate(6px,-6px) skewX(-2deg)}70%{transform:translate(-4px,0)}}
.sk-proj{
  position:absolute;left:50%;top:42%;z-index:6;font-size:52px;pointer-events:none;
  transform:translate(-50%,-50%);opacity:0;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));
}
.sk-proj.go-up{animation:skProjUp .7s ease-out forwards;}
.sk-proj.go-burst{animation:skProjBurst .65s ease-out forwards;}
.sk-proj.go-wave{animation:skProjWave .75s ease-out forwards;}
@keyframes skProjUp{0%{transform:translate(-50%,-20%) scale(.35);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-160%) scale(1.35);opacity:0}}
@keyframes skProjBurst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}30%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-50%) scale(2.1);opacity:0}}
@keyframes skProjWave{0%{transform:translate(-50%,10%) scale(.4) rotate(-12deg);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-130%) scale(1.3) rotate(18deg);opacity:0}}
.sk-info{position:relative;z-index:6;text-align:center;margin-top:2px;animation:skUp .5s .4s both;}
@keyframes skUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.sk-type{display:inline-block;color:#fff;font-size:11.5px;font-weight:900;padding:2px 12px;border-radius:99px;}
.sk-line{color:#e8eaf6;font-size:13.5px;font-weight:800;margin-top:8px;letter-spacing:1px;}
.sk-move{color:#fff;font-size:27px;font-weight:900;letter-spacing:1.5px;text-shadow:0 3px 16px rgba(0,0,0,.65);animation:skPop .55s .55s both;}
@keyframes skPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.sk-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
.sk-flash.go{animation:skFlash .44s ease-out;}
@keyframes skFlash{0%{opacity:0}16%{opacity:.85}100%{opacity:0}}
.sk-close{position:absolute;top:16px;right:16px;z-index:8;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:15px;font-weight:900;border:none;}
.sk-hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:rgba(255,255,255,.62);font-size:11.5px;font-weight:700;z-index:7;}
.mon-detail .md-move.demoable{cursor:pointer;border:2px solid var(--pk-edge);background:var(--pk-paper);box-shadow:0 2px 0 rgba(42,36,32,.1);}
.mon-detail .md-move.demoable:active{transform:scale(.97);}
.mon-detail .md-tip{font-size:11.5px;color:#8a7a6a;font-weight:700;margin:6px 0 0;}

/* ===== 图鉴 ===== */
.dex-grid{display:flex;flex-wrap:wrap;gap:7px;}
.dex-slot{flex:0 0 calc((100% - 14px)/3);min-width:0;box-sizing:border-box;background:var(--pk-paper);border:2.5px solid var(--pk-edge);border-radius:12px;padding:7px 4px;text-align:center;cursor:pointer;box-shadow:0 2px 0 rgba(42,36,32,.1);}
.dex-slot.on{border-color:var(--pk-edge);box-shadow:0 2px 0 rgba(42,36,32,.12),0 0 0 2px rgba(255,203,5,.45);}
.dex-slot .ds-ic{height:44px;display:flex;align-items:center;justify-content:center;}
.dex-slot .ds-nm{font-size:10.5px;font-weight:900;color:var(--pk-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-display);}
.dex-slot .ds-lv{font-size:9px;color:var(--pk-ink-soft);font-weight:800;}
.dex-all{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px;}
.dex-cell{min-width:0;box-sizing:border-box;background:var(--pk-soft);border:2px solid var(--pk-edge);border-radius:9px;padding:4px 1px;text-align:center;}
.dex-cell.got{background:var(--pk-paper);border-color:var(--pk-edge);cursor:pointer;box-shadow:0 2px 0 rgba(42,36,32,.08);}
.dex-cell .dc-no{font-size:7px;font-weight:900;color:#9A8874;line-height:1.2;}
.dex-cell.got .dc-no{color:var(--pk-green);}
.dex-cell .dc-ic{height:36px;display:flex;align-items:center;justify-content:center;}
.dex-cell .dc-ic img{width:34px!important;height:34px!important;object-fit:contain;}
.dex-cell .dc-nm{font-size:8px;font-weight:900;color:var(--pk-ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* ===== 桌面适配 ===== */

  .app{padding-bottom:120px;}

  main{padding:18px 18px 10px;}

}

}

<script>
"use strict";
/* ================= 工具 ================= */
var $ = function(id){return document.getElementById(id);};
function pad2(n){return (n<10?'0':'')+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function yesterdayStr(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function nowHM(){var d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function parseDate(s){return new Date(s+'T00:00:00');}
function dayDiff(a,b){return Math.round((parseDate(a)-parseDate(b))/86400000);}
function addDays(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function weekdayCN(s){return '日一二三四五六'[parseDate(s).getDay()]+'曜日';}
function fmtCN(s){var p=s.split('-');return (+p[1])+'月'+(+p[2])+'日';}
function isWeekendStr(s){var w=parseDate(s).getDay();return w===0||w===6;}
function weekKey(){var d=new Date();var day=d.getDay()||7;var m=new Date(d);m.setDate(m.getDate()-(day-1));return m.getFullYear()+'-'+pad2(m.getMonth()+1)+'-'+pad2(m.getDate());}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rnd(n){return Math.floor(Math.random()*n);}
function pickWeighted(list){var total=list.reduce(function(a,x){return a+x.w;},0);var r=Math.random()*total;var acc=0;for(var i=0;i<list.length;i++){acc+=list[i].w;if(r<acc)return list[i].v;}return list[list.length-1].v;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ================= 声音 ================= */
var AC=null, SOUND=true, AUDIO_UNLOCKED=false, HTML_BEEP_URL=null, HTML_BEEP_EL=null;
function audio(){
  try{ SOUND=!(S&&S.sound===false); }catch(e){}
  if(!SOUND) return null;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e2){ AC=null; } }
  return AC;
}
function makeBeepWavUrl(freq,dur,vol){
  try{
    var sr=22050, n=Math.max(1, Math.floor(sr*(dur||0.12)));
    var buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
    function ws(o,s){ for(var i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); }
    ws(0,'RIFF'); v.setUint32(4,36+n*2,true); ws(8,'WAVE'); ws(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    ws(36,'data'); v.setUint32(40,n*2,true);
    var f=freq||880, amp=vol==null?0.55:vol;
    for(var i=0;i<n;i++){
      var t=i/sr, env=Math.min(1, i/(sr*0.01))*Math.max(0,1-i/n);
      var s=Math.sin(2*Math.PI*f*t)*amp*env;
      v.setInt16(44+i*2, (s*0x7FFF)|0, true);
    }
    return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  }catch(e){ return null; }
}
function playHtmlBeep(freq){
  try{
    if(!SOUND) return;
    var url=makeBeepWavUrl(freq||720,0.14,0.7);
    if(!url) return;
    var a=new Audio(url);
    a.setAttribute('playsinline','playsinline');
    a.volume=1;
    var p=a.play();
    if(p&&p.catch) p.catch(function(){});
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} },800);
  }catch(e){}
}
/* iOS/Safari：手势里同步 resume + 静音 buffer + HTMLAudio 预热 */
function unlockAudio(){
  try{ SOUND=!(S&&S.sound===false); }catch(e){}
  if(!SOUND) return null;
  var ac=audio(); if(!ac) return null;
  try{ if(ac.state==='suspended'&&ac.resume) ac.resume(); }catch(e){}
  if(!AUDIO_UNLOCKED){
    try{
      var buf=ac.createBuffer(1,1,ac.sampleRate||22050);
      var src=ac.createBufferSource();
      src.buffer=buf; src.connect(ac.destination); src.start(0);
    }catch(e2){}
    try{
      var o=ac.createOscillator(), g=ac.createGain();
      g.gain.value=0.0001; o.connect(g); g.connect(ac.destination);
      o.start(0); o.stop(ac.currentTime+0.03);
    }catch(e3){}
    try{
      if(!HTML_BEEP_URL) HTML_BEEP_URL=makeBeepWavUrl(660,0.08,0.01);
      if(HTML_BEEP_URL){
        HTML_BEEP_EL=new Audio(HTML_BEEP_URL);
        HTML_BEEP_EL.setAttribute('playsinline','playsinline');
        HTML_BEEP_EL.volume=0.01;
        var hp=HTML_BEEP_EL.play();
        if(hp&&hp.then) hp.then(function(){ try{ HTML_BEEP_EL.pause(); HTML_BEEP_EL.currentTime=0; }catch(e4){} }).catch(function(){});
      }
    }catch(e5){}
    AUDIO_UNLOCKED=true;
  }
  return ac;
}
function ensureAudio(){
  if(!SOUND) return null;
  return unlockAudio();
}
function withAudio(fn){
  if(!SOUND||!fn) return;
  var ac=unlockAudio();
  if(!ac){ try{fn(null);}catch(e){} return; }
  if(ac.state==='running'){ try{fn(ac);}catch(e){} return; }
  var go=function(){ try{fn(ac);}catch(e){} };
  try{
    var p=ac.resume?ac.resume():null;
    if(p&&typeof p.then==='function'){ p.then(go).catch(go); return; }
  }catch(e){}
  go();
}
function toneAt(ac,f,t0,d,type,vol){
  if(!ac) return;
  try{
    var o=ac.createOscillator(), g=ac.createGain(), v=Math.max(0.001, vol||0.2);
    o.type=type||'sine';
    o.frequency.setValueAtTime(Math.max(40,f||440), t0);
    g.gain.setValueAtTime(v, t0);
    try{ g.gain.exponentialRampToValueAtTime(0.001, t0+(d||0.1)); }
    catch(e){ g.gain.linearRampToValueAtTime(0.001, t0+(d||0.1)); }

function slideAt(ac,f0,f1,t0,d,type,vol){
  if(!ac) return;
  try{
    var o=ac.createOscillator(), g=ac.createGain(), v=Math.max(0.001, vol||0.18);
    o.type=type||'sine';
    o.frequency.setValueAtTime(Math.max(40,f0||200), t0);
    try{ o.frequency.exponentialRampToValueAtTime(Math.max(40,f1||200), t0+(d||0.2)); }
    catch(e){ o.frequency.linearRampToValueAtTime(Math.max(40,f1||200), t0+(d||0.2)); }
    g.gain.setValueAtTime(v, t0);
    try{ g.gain.exponentialRampToValueAtTime(0.001, t0+(d||0.2)); }
    catch(e2){ g.gain.linearRampToValueAtTime(0.001, t0+(d||0.2)); }
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+(d||0.2)+0.03);
  }catch(e){}
}
function beep(f,d,type,vol){
  if(!SOUND) return;
  var ac=unlockAudio(); if(!ac) return;
  var play=function(){ toneAt(ac,f,ac.currentTime,d,type,vol); };
  if(ac.state==='running'){ play(); return; }
  try{
    var p=ac.resume&&ac.resume();
    if(p&&typeof p.then==='function'){ p.then(play).catch(play); return; }
  }catch(e){}
  play();
}

}
